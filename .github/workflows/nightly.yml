name: Nightly

# Nightly QA builds. This channel never touches stable release assets: it
# publishes its own prerelease whose version is derived from the pinned source
# SHA, and uploads the same installer set as a QA artifact. Everything here is
# unsigned (no Apple/Windows certificate, no updater signature).
#
# A scheduled run only publishes when the branch moved since the last nightly,
# so an idle schedule is a no-op instead of a duplicate build.

on:
  schedule:
    - cron: '0 18 * * *'
  workflow_dispatch:
    inputs:
      force:
        description: Build even when no new commit landed since the last nightly
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: nightly-${{ github.ref }}
  cancel-in-progress: true

env:
  PNPM_VERSION: 10.34.3
  NIGHTLY_BRANCH: main

jobs:
  plan:
    name: Decide whether a nightly is needed
    runs-on: ubuntu-latest
    outputs:
      needed: ${{ steps.decide.outputs.needed }}
      version: ${{ steps.decide.outputs.version }}
      tag: ${{ steps.decide.outputs.tag }}
      sha: ${{ steps.decide.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.NIGHTLY_BRANCH }}
          fetch-depth: 0
      - id: decide
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          FORCE: ${{ inputs.force || 'false' }}
        run: |
          set -euo pipefail

          full_sha="$(git rev-parse HEAD)"
          last_sha="$(gh release list --repo "$GITHUB_REPOSITORY" --limit 100 \
            --json tagName --jq '[.[].tagName | select(startswith("nightly-"))] | first // ""' 2>/dev/null || true)"
          if [[ -n "$last_sha" ]]; then
            last_sha="${last_sha##*.}"
          fi

          if [[ "$FORCE" != "true" && "$last_sha" == "${full_sha:0:12}" ]]; then
            echo "No new commit since the last nightly; skipping."
            { echo "needed=false"; echo "sha=$full_sha"; } >> "$GITHUB_OUTPUT"
            exit 0
          fi

          date_stamp="$(date -u +%Y%m%d)"
          base_version="$(node -p "JSON.parse(require('fs').readFileSync('package.json', 'utf8')).version")"
          stable_base="${base_version%%-*}"
          version="${stable_base}-nightly.${date_stamp}.${full_sha:0:12}"
          { echo "needed=true"; echo "sha=$full_sha"; echo "version=$version"; echo "tag=nightly-$version"; } >> "$GITHUB_OUTPUT"
          echo "Nightly version: $version"

  build:
    name: Build nightly (${{ matrix.name }})
    needs: plan
    if: needs.plan.outputs.needed == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS universal
            os: macos-15
            # universal-apple-darwin is a Tauri bundle target, not a rustup
            # target: rustup only knows the two architecture triples. Tauri
            # builds both and lipos them itself.
            target: universal-apple-darwin
            rust_targets: aarch64-apple-darwin,x86_64-apple-darwin
            bundles: dmg
            asset_key: macos-universal
          - name: Windows x64
            os: windows-latest
            target: x86_64-pc-windows-msvc
            rust_targets: x86_64-pc-windows-msvc
            bundles: nsis
            asset_key: windows-x86_64
          - name: Linux x64
            os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            rust_targets: x86_64-unknown-linux-gnu
            bundles: deb,appimage
            asset_key: linux-x86_64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.NIGHTLY_BRANCH }}
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.96.0
          targets: ${{ matrix.rust_targets }}
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: nightly-${{ matrix.target }}
          workspaces: src-tauri -> target
      - name: Install Tauri Linux dependencies
        if: runner.os == 'Linux'
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            build-essential curl file libayatana-appindicator3-dev libssl-dev \
            libudev-dev libwebkit2gtk-4.1-dev librsvg2-dev patchelf libxdo-dev
      - run: pnpm install --frozen-lockfile
      - name: Override the declared version with the nightly version
        shell: bash
        env:
          NIGHTLY_VERSION: ${{ needs.plan.outputs.version }}
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/bump-version.cjs" <<'NODE'
          const fs = require('node:fs')
          const version = process.env.NIGHTLY_VERSION

          for (const file of ['package.json', 'src-tauri/tauri.conf.json']) {
            const json = JSON.parse(fs.readFileSync(file, 'utf8'))
            json.version = version
            fs.writeFileSync(file, JSON.stringify(json, null, 2) + '\n')
          }

          // Windows checkouts can carry CRLF line endings, where a `$`-anchored
          // pattern and `.` never match the way they do on LF. Both patterns
          // below are line-ending agnostic and fail loudly when they do not
          // match, instead of silently leaving a stale version behind.
          const mustReplace = (file, pattern, replacement) => {
            const text = fs.readFileSync(file, 'utf8')
            if (!pattern.test(text)) {
              throw new Error('nightly version bump did not match in ' + file)
            }
            fs.writeFileSync(file, text.replace(pattern, replacement))
          }

          mustReplace(
            'src-tauri/Cargo.toml',
            /^version = "[^"]*"/m,
            'version = "' + version + '"',
          )
          mustReplace(
            'src-tauri/Cargo.lock',
            /(name = "terminal"\r?\nversion = )"[^"]*"/,
            '$1"' + version + '"',
          )
          NODE
          node "$RUNNER_TEMP/bump-version.cjs"
          echo "tauri.conf version: $(node -p "require('./src-tauri/tauri.conf.json').version")"
          grep -q "$NIGHTLY_VERSION" src-tauri/Cargo.toml
          grep -q "$NIGHTLY_VERSION" src-tauri/Cargo.lock
          cargo metadata --locked --no-deps --format-version 1 --manifest-path src-tauri/Cargo.toml > /dev/null
          echo "Cargo.lock accepts --locked after the version bump"
      - name: Build nightly bundles
        shell: bash
        run: pnpm tauri build --target ${{ matrix.target }} --bundles ${{ matrix.bundles }} --ci -- --locked
      - name: Verify bundles exist and are non-empty
        shell: bash
        run: |
          set -euo pipefail
          bundle_root="src-tauri/target/${{ matrix.target }}/release/bundle"
          found=0
          for extension in dmg exe AppImage deb; do
            while IFS= read -r -d '' file; do
              if [ ! -s "$file" ]; then
                echo "Empty bundle: $file" >&2
                exit 1
              fi
              found=$((found + 1))
            done < <(find "$bundle_root" -type f -name "*.${extension}" -print0)
          done
          if [ "$found" -eq 0 ]; then
            echo "No nightly bundle produced under $bundle_root" >&2
            exit 1
          fi
          echo "Verified $found bundle file(s)"
      - name: Stage assets with deterministic names
        shell: bash
        env:
          NIGHTLY_VERSION: ${{ needs.plan.outputs.version }}
        run: |
          set -euo pipefail
          mkdir -p nightly-assets
          bundle_root="src-tauri/target/${{ matrix.target }}/release/bundle"
          for suffix in dmg exe AppImage deb; do
            while IFS= read -r -d '' file; do
              base="$(basename "$file")"
              extension="${base##*.}"
              cp "$file" "nightly-assets/Terminal-${NIGHTLY_VERSION}-${{ matrix.asset_key }}.${extension}"
            done < <(find "$bundle_root" -type f -name "*.${suffix}" -print0)
          done
          ls -l nightly-assets
          if [ -z "$(ls -A nightly-assets)" ]; then
            echo "Staged no nightly assets" >&2
            exit 1
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: nightly-${{ matrix.asset_key }}
          path: nightly-assets/*
          if-no-files-found: error
          retention-days: 14

  publish:
    name: Publish nightly prerelease
    needs: [plan, build]
    if: needs.plan.outputs.needed == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: nightly-*
          path: nightly-assets
          merge-multiple: true
      - name: Publish or update the nightly prerelease
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.plan.outputs.tag }}
          VERSION: ${{ needs.plan.outputs.version }}
          SHA: ${{ needs.plan.outputs.sha }}
        run: |
          set -euo pipefail
          ( cd nightly-assets && sha256sum -- * > SHA256SUMS.txt )
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" nightly-assets/* --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$TAG" nightly-assets/* \
              --repo "$GITHUB_REPOSITORY" \
              --title "Nightly $VERSION" \
              --notes "Unsigned QA nightly built at $SHA. No Apple or Windows code signing, no notarization, no updater signatures: these installers must not be presented as a stable release." \
              --prerelease \
              --target "$SHA"
          fi
          echo "Nightly published: $TAG"
