name: Real-machine terminal matrix

# Runs the desktop terminal against real PTYs and real SSH servers on
# macOS and Linux native runners. The macOS job executes the Docker-free
# SSH authentication matrix (key/agent/cert/jump + reconnect) that is also
# run locally via `pnpm smoke:ssh-matrix`; the Linux job runs the password
# matrix inside the real Debian OpenSSH container (Docker is unavailable on
# GitHub macOS runners) plus the public-key smoke and its disconnect/
# reconnect variant under Xvfb.
#
# Windows real-machine coverage remains a manual checklist (docs/issue.md
# Issue #21/#22/#39): OpenSSH service, Pageant, PTY and serial hardware are
# not yet automated on Windows runners.

on:
  workflow_dispatch:
  schedule:
    - cron: '30 3 * * 1'

permissions:
  contents: read

env:
  PNPM_VERSION: 10.34.3

jobs:
  macos-ssh-matrix:
    name: macOS real SSH matrix
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
      - run: pnpm install --frozen-lockfile
      - name: Run the Docker-free real SSH authentication matrix
        run: node scripts/run-terminal-smoke-matrix.mjs key,key-reconnect,agent,cert,jump
      - name: Verify the physical keyboard probe protocol in a real WKWebView
        # macOS runners cannot grant Accessibility to CGEvent injection, so
        # this step only proves the app-side probe boots a local PTY and
        # publishes the awaiting-input checkpoint; overlapping-key injection
        # runs on developer machines via `pnpm smoke:input-probe`.
        run: node scripts/run-input-probe.mjs --checkpoint-only

  linux-ssh-smoke:
    name: Linux real SSH smoke
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
      - name: Install WebKitGTK build dependencies and OpenSSH server
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            libudev-dev \
            pkg-config \
            openssh-server
      - run: pnpm install --frozen-lockfile
      - name: Run public-key smoke and reconnect smoke under Xvfb
        run: |
          mkdir -p "$HOME/terminal-smoke-tmp"
          export TERMINAL_SMOKE_TMP="$HOME/terminal-smoke-tmp"
          xvfb-run -a pnpm smoke:terminal
          xvfb-run -a pnpm smoke:terminal:reconnect
      - name: Run the password authentication matrix in Docker
        # GitHub macOS runners have no Docker engine, so the real Debian
        # OpenSSH password fixture runs here instead.
        run: |
          mkdir -p "$HOME/terminal-smoke-tmp"
          export TERMINAL_SMOKE_TMP="$HOME/terminal-smoke-tmp"
          xvfb-run -a node scripts/run-terminal-smoke-matrix.mjs password,password-reconnect
