name: Real-machine terminal matrix

# Runs the desktop terminal against real PTYs and real SSH servers on
# macOS and Linux native runners, and produces the six current evidence files
# on the macOS runner instead of on a developer machine.
#
# The macOS job is one evidence production chain, in this order and no
# other: build the instrumented debug binary and hash it, measure its four
# scenarios (local cold start three times, remote prompt cold start, the 13-case
# authenticated SSH matrix, the local 14 + real SSH 7 shell matrix), build the
# instrumented release binary and hash it, measure its two scenarios (local cold
# start three times, the 10-case authenticated SSH matrix), then turn the seven
# `2>&1 | tee` logs into docs/verification plus evidence-manifest.json and
# upload the bundle. `scripts/build-verification-evidence.mjs` refuses to write
# anything unless every scenario is complete and green, and refuses when a log
# measured a different binary than the one this job hashed.
#
# Every `2>&1 | tee` step declares `shell: bash` on purpose. The default shell
# of a macOS or Linux job is `bash -e {0}`, which has no `pipefail`: a failing
# matrix exits 1 into `tee`, `tee` exits 0, and the step stays green while its
# log records the failure. GitHub's `bash` keyword expands to
# `bash --noprofile --norc -eo pipefail {0}`, so the pipe hands the runner's
# own exit code back to the step.
#
# `scripts/check-verification-evidence.mjs` binds the six files to that
# manifest (fingerprint, both artifact hashes, run id) rather than to a binary
# on a developer machine, because a local build and a CI build of the same
# sources are not guaranteed to be bit-identical. Download a run with
# `node scripts/fetch-verification-evidence.mjs --latest`.
#
# The Linux job runs the password matrix inside the real Debian OpenSSH
# container (Docker is unavailable on GitHub macOS runners) plus the public-key
# smoke and its disconnect/reconnect variant under Xvfb. The Windows job drives
# the PowerShell and cmd shell interaction dialects against a real ConPTY.
# Those dialects cannot be exercised on macOS or Linux, so without this job the
# Windows command language would ship unexecuted. Windows OpenSSH service,
# Pageant and serial hardware remain a manual checklist (docs/issue.md Issue
# #21/#22/#39): they need an installed service or attached hardware that a
# hosted runner does not provide.

on:
  workflow_dispatch:
  schedule:
    - cron: '30 3 * * 1'

permissions:
  contents: read

env:
  PNPM_VERSION: 10.34.3

jobs:
  macos-ssh-matrix:
    name: macOS real SSH matrix
    runs-on: macos-latest
    # Seven measured scenarios plus two instrumented Rust builds have to fit in
    # one job: the evidence is only valid when every measurement describes the
    # artifacts this same job built and hashed.
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24.16.0
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
      - run: pnpm install --frozen-lockfile

      - name: Create the evidence log directory
        # Every scenario below appends to this directory; the evidence builder
        # reads nothing else, so a missing log means a scenario never ran.
        run: mkdir -p evidence-logs

      - name: Build the instrumented debug binary and record its sha256
        # The plain build has no smoke/probe entry points and the runners refuse
        # it, so VITE_TERMINAL_SMOKE_BUILD=1 is mandatory. The hash is taken
        # here, once: every debug scenario below reuses this file with
        # --reuse-binary instead of rebuilding it.
        run: |
          VITE_TERMINAL_SMOKE_BUILD=1 pnpm tauri build --debug --no-bundle
          shasum -a 256 src-tauri/target/debug/terminal > evidence-logs/debug.sha256
          echo "DEBUG_SHA=$(cut -d' ' -f1 evidence-logs/debug.sha256)" >> "$GITHUB_ENV"

      - name: Measure local PTY cold-start to terminal marker
        # The marker is produced only after the nonce command traverses the
        # real WKWebView/xterm input path, Tauri session_write and the local
        # PTY shell, so this is stricter than AX window readiness alone. Three
        # separate invocations provide the contract's three independent
        # samples; tee -a keeps all three JSON documents in one log.
        run: |
          for measurement in 1 2 3; do
            pnpm smoke:local-cold-start -- \
              --app-path "$GITHUB_WORKSPACE/src-tauri/target/debug/terminal" 2>&1 | tee -a evidence-logs/debug-local-cold-start.log
          done
        shell: bash

      - name: Measure remote SSH cold-start to prompt marker
        # This uses the same freshly built debug binary as the shell matrix and
        # proves startup marker + OSC 133 prompt round-trip through a real SSH
        # PTY. It does not claim WAN or first-user workspace coverage.
        run: |
          pnpm smoke:remote-cold-start -- \
            --app-path "$GITHUB_WORKSPACE/src-tauri/target/debug/terminal" 2>&1 | tee evidence-logs/debug-remote-cold-start.log
        shell: bash

      - name: Run the Docker-free real SSH authentication matrix
        # --reuse-binary is appended after the case list on purpose: the log has
        # to describe the binary hashed above, and a second build here would
        # relink it.
        run: node scripts/run-terminal-smoke-matrix.mjs key,key-reconnect,key-outage-reconnect,key-outage-wake-reconnect,agent,agent-reconnect,cert,cert-reconnect,jump,jump-reconnect --reuse-binary 2>&1 | tee evidence-logs/debug-ssh-matrix.log
        shell: bash

      - name: Run the remaining authenticated matrix cases
        # The 11-case contract also needs key-first-connect-outage, which runs as
        # a second invocation appending to the same log so the step above stays
        # exactly the command the workflow contract test pins. The password cases
        # are not measured here: a hosted runner has no Docker and the native
        # fallback cannot carry them yet (docs/issue.md #144); the Linux job runs
        # them against the Debian OpenSSH image instead.
        run: node scripts/run-terminal-smoke-matrix.mjs --reuse-binary key-first-connect-outage 2>&1 | tee -a evidence-logs/debug-ssh-matrix.log
        shell: bash

      - name: Run the real Tauri shell interaction matrix
        run: pnpm smoke:shell-probe:matrix -- --shells bash,zsh cat-eof,readline-history,readline-tab,vim-edit,nano-edit,pty-resize,ctrl-c-interrupt --reuse-binary 2>&1 | tee evidence-logs/debug-shell-probe-local.log
        shell: bash

      - name: Run the shell interaction matrix over real SSH
        # The same seven cases, but driven through a real loopback sshd rather
        # than a local PTY. Line editing, PTY geometry and interrupt delivery
        # break exactly where a PTY and an sshd channel differ, so running the
        # cases on only one transport would leave that gap open.
        run: pnpm smoke:shell-probe:matrix -- --transport ssh cat-eof,readline-history,readline-tab,vim-edit,nano-edit,pty-resize,ctrl-c-interrupt --reuse-binary 2>&1 | tee evidence-logs/debug-shell-probe-ssh.log
        shell: bash

      - name: Verify the physical keyboard probe protocol in a real WKWebView
        # macOS runners cannot grant Accessibility to CGEvent injection, so
        # this step only proves the app-side probe boots a local PTY and
        # publishes the awaiting-input checkpoint; overlapping-key injection
        # runs on developer machines via node scripts/run-input-probe.mjs.
        run: node scripts/run-input-probe.mjs --checkpoint-only

      - name: Build the instrumented release binary and record its sha256
        run: |
          VITE_TERMINAL_SMOKE_BUILD=1 pnpm tauri build --no-bundle
          shasum -a 256 src-tauri/target/release/terminal > evidence-logs/release.sha256
          echo "RELEASE_SHA=$(cut -d' ' -f1 evidence-logs/release.sha256)" >> "$GITHUB_ENV"

      - name: Measure the release terminal marker three times
        run: |
          for measurement in 1 2 3; do
            pnpm smoke:local-cold-start -- \
              --app-path "$GITHUB_WORKSPACE/src-tauri/target/release/terminal" 2>&1 | tee -a evidence-logs/release-local-cold-start.log
          done
        shell: bash

      - name: Run the release authentication matrix with the ten contract cases
        # A bare --release run executes all 13 cases, which the gate's
        # RELEASE_SSH_CASES (10, without the three outage cases) would reject.
        run: node scripts/run-terminal-smoke-matrix.mjs key,key-reconnect,agent,agent-reconnect,cert,cert-reconnect,jump,jump-reconnect --release --reuse-binary 2>&1 | tee evidence-logs/release-ssh-matrix.log
        shell: bash

      - name: Generate the six evidence files and the CI manifest
        # Fail-closed: nothing is written unless all seven logs are complete,
        # green, and describe the two binaries hashed above. DEBUG_SHA,
        # RELEASE_SHA and the GITHUB_* provenance variables arrive through the
        # environment.
        run: |
          node scripts/build-verification-evidence.mjs \
            --logs evidence-logs \
            --out docs/verification \
            --os-name "$(sw_vers -productName) $(sw_vers -productVersion)"

      - name: Assemble the verification evidence bundle
        # Staged under one directory so the download layout is explicit:
        # docs/verification/*.json, evidence-logs/*.log and binaries/.
        if: always()
        run: |
          mkdir -p evidence-artifact/docs/verification evidence-artifact/evidence-logs evidence-artifact/binaries/debug evidence-artifact/binaries/release
          cp evidence-logs/*.log evidence-artifact/evidence-logs/ || true
          for file in \
            2026-10-11-macos-cold-start-current.json \
            2026-10-11-macos-remote-shell-prompt-rerun.json \
            2026-10-11-macos-ssh-matrix-current.json \
            2026-10-11-macos-shell-interaction-current.json \
            2026-10-11-macos-release-terminal-gate.json \
            2026-10-11-macos-release-ssh-matrix.json \
            evidence-manifest.json; do
            cp "docs/verification/$file" evidence-artifact/docs/verification/ || true
          done
          cp src-tauri/target/debug/terminal evidence-artifact/binaries/debug/terminal || true
          cp src-tauri/target/release/terminal evidence-artifact/binaries/release/terminal || true

      - uses: actions/upload-artifact@v4
        # Uploaded even when a step above failed: the logs are the only way to
        # see why a scenario refused to produce evidence.
        if: always()
        with:
          name: verification-evidence
          path: evidence-artifact
          if-no-files-found: warn
          retention-days: 30

  linux-ssh-smoke:
    name: Linux real SSH smoke
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24.16.0
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
      - name: Install WebKitGTK build dependencies and OpenSSH server
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            libudev-dev \
            pkg-config \
            openssh-server \
            bash \
            zsh \
            vim \
            nano
      - run: pnpm install --frozen-lockfile
      - name: Run public-key smoke and reconnect smoke under Xvfb
        run: |
          mkdir -p "$HOME/terminal-smoke-tmp"
          export TERMINAL_SMOKE_TMP="$HOME/terminal-smoke-tmp"
          xvfb-run -a pnpm smoke:terminal
          xvfb-run -a pnpm smoke:terminal:reconnect
      - name: Run the password authentication matrix in Docker
        # GitHub macOS runners have no Docker engine, so the real Debian
        # OpenSSH password fixture runs here instead.
        run: |
          mkdir -p "$HOME/terminal-smoke-tmp"
          export TERMINAL_SMOKE_TMP="$HOME/terminal-smoke-tmp"
          xvfb-run -a node scripts/run-terminal-smoke-matrix.mjs password,password-reconnect
      - name: Run the real Linux shell interaction matrix
        run: |
          # fish has no dialect implementation yet; keep it in the explicit
          # pending matrix instead of sending POSIX bash syntax to fish.
          xvfb-run -a pnpm smoke:shell-probe:matrix -- --shells bash,zsh cat-eof,readline-history,readline-tab,vim-edit,nano-edit,pty-resize,ctrl-c-interrupt
      - name: Measure Linux remote SSH cold-start to prompt marker
        # Linux has no macOS Accessibility API, so the runner uses the same
        # remote startup and prompt marker round-trip without AX probing. The
        # hosted WebKitGTK runner can spend more than the product's 10-second
        # local readiness budget starting its first process, so this step uses
        # a wider observation window and records the actual elapsed value.
        env:
          TERMINAL_DEBUG_SSH_PROFILE: '1'
        run: |
          xvfb-run -a pnpm smoke:remote-cold-start -- \
            --app-path "$GITHUB_WORKSPACE/src-tauri/target/debug/terminal" \
            --timeout-ms 30000

  windows-shell-matrix:
    name: Windows PowerShell and cmd shell matrix
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24.16.0
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
      - run: pnpm install --frozen-lockfile
      - name: Run the PowerShell and cmd shell interaction matrix
        # PowerShell claims cat-eof, pty-resize and ctrl-c-interrupt; cmd claims
        # cat-eof and ctrl-c-interrupt, because a stock Windows runner has
        # neither a POSIX line editor nor a window-size readout. The runner
        # rejects any case a dialect does not claim rather than silently
        # reporting a smaller run than requested, so the filters below have to
        # match dialect-cases.ts exactly.
        run: |
          pnpm smoke:shell-probe:matrix -- --shells powershell cat-eof,pty-resize,ctrl-c-interrupt
          pnpm smoke:shell-probe:matrix -- --shells cmd cat-eof,ctrl-c-interrupt
