name: SSH soak

# F14/F17 — the 100-round resource soak, manually dispatched.
#
# ## Why this is not part of `ci.yml`
#
# `ci.yml` runs the 12-round lifecycle regression on every PR. That one is fast and
# blocks on deterministic facts (the pool and registry return to zero). This one is a
# *curve*: 100 real connect/handshake/exec/disconnect rounds against two `sshd` daemons,
# on a dedicated runner that is not also building three Tauri targets. A curve measured
# on a busy shared runner describes the runner.
#
# It never writes `docs/verification` and never produces a release verdict — the same
# rule `cold-start-stress.yml` follows.
on:
  workflow_dispatch:
    inputs:
      rounds:
        description: Connect/disconnect rounds
        required: false
        default: '100'

permissions:
  contents: read

jobs:
  soak:
    name: SSH resource soak
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      # No `version:` here, deliberately.
      #
      # The first dispatch of this workflow (run 45826816593) failed at this step:
      #
      #   Error: Multiple versions of pnpm specified
      #
      # `package.json` declares `packageManager: pnpm@10.34.3`, and this step asked for
      # 10.18.3 — `pnpm/action-setup` refuses rather than picking one. `ci.yml` never hits
      # this because its version comes from `env.PNPM_VERSION`, the same 10.34.3. Leaving
      # the input out makes `packageManager` the single source, which is what the other
      # workflows effectively do and what a fresh workflow should have done from the start.
      - uses: pnpm/action-setup@v4
        with:
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.96.0
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
      - name: Run the soak
        env:
          SSH_JUMP_E2E_ROUNDS: ${{ inputs.rounds }}
          SSH_JUMP_E2E_TIMEOUT_MS: '1800000'
          SSH_JUMP_E2E_REPORT: soak-report.json
        run: node scripts/verify-install/ssh-jump-e2e.mjs
      - name: Upload the soak report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ssh-soak-report-${{ github.run_id }}
          path: soak-report.json
          # Same rule as the PR-time matrix job (`ci.yml`): a report that was never
          # written must fail the step, not warn. This workflow does set
          # `SSH_JUMP_E2E_REPORT`, so the file exists today — but `warn` is what let the
          # PR-time job upload nothing for its whole history without anyone noticing.
          if-no-files-found: error
          retention-days: 30
