name: CI

# ## Why a push on a feature branch no longer runs this
#
# Measured before this change: every commit produced **two** full runs, one for
# `push` and one for `pull_request` —
#
#     43692358326 pull_request  e67ee9f2
#     43692356593 push          e67ee9f2
#
# and the two did not cancel each other, because their concurrency groups differ:
# `push` keys on `refs/heads/<branch>` and `pull_request` on `refs/pull/N/merge`.
# Eleven jobs ran twice per commit, including a three-platform Tauri build.
#
# The PR run is the one that matters for merging, and it is the one branch protection
# can require. A push to a feature branch adds nothing: it asserts the same tree the PR
# run already asserted. So `push` is narrowed to `main`, which is the case that has no
# PR run at all — a merged commit needs its own integration result.
#
# Release-tag pushes are deliberately **not** here: `release.yml` owns tags, and a
# cancelled release run is not recoverable the way a cancelled PR run is.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  # ## Why `actions: read` is required, and why it is the only addition
  #
  # The failure-attribution step lists the run's jobs and downloads a failing job's
  # log. Both are Actions API reads:
  #
  #   GET /repos/{owner}/{repo}/actions/runs/{id}/jobs
  #   GET /repos/{owner}/{repo}/actions/jobs/{job_id}/logs
  #
  # Without `actions: read` the first returns an empty/403 body and the second 403s.
  # On a **public** repository these endpoints are readable anonymously, which is why
  # the previous `contents: read` appeared to work — until the token was used and the
  # log download redirected to a URL the token was not attached to.
  #
  # `write` is not needed and is not granted: nothing here cancels, re-runs or mutates
  # a run. If this job ever needs to re-run a workflow it must request that separately,
  # deliberately.
  actions: read

# `cancel-in-progress` stays true for PRs only: a new commit on a PR makes the old
# run's verdict irrelevant, while a `main` run's verdict is the record of that commit
# and must not be thrown away because a later commit arrived.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  PNPM_VERSION: 10.34.3

jobs:
  # ## Classify the change before deciding what to run
  #
  # `paths-ignore` used to sit on the workflow trigger, which meant a docs-only PR
  # created **no run at all** — and a required check that never reports leaves the PR
  # permanently pending. That is the failure mode this job exists to avoid: classify
  # inside the run so `required` always has something to report on.
  #
  # `docs-only` is what lets the expensive jobs skip while `CI / required` still passes
  # honestly. Any change outside the documentation globs — including a change to this
  # workflow — clears it.
  changes:
    name: Classify change
    runs-on: ubuntu-latest
    outputs:
      docs_only: ${{ steps.classify.outputs.docs_only }}
      changed: ${{ steps.classify.outputs.changed }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # The classification runs in a script so it can be tested. The inline version
      # had a fail-open path nothing could see: on a failed `git diff` it fell back to
      # `git show --name-only HEAD`, which describes **one commit** rather than the
      # branch — so a branch whose last commit touched only Markdown was classified
      # docs-only while earlier commits had changed `src-tauri/`.
      #
      # The script fails closed: an unreadable diff is not documentation
      # (`scripts/classify-change.mjs`, 12 cases in its test file).
      - id: classify
        shell: bash
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.base_ref }}
          BEFORE: ${{ github.event.before }}
        run: |
          set -euo pipefail
          if [[ "$EVENT" == "workflow_dispatch" ]]; then
            echo "docs_only=false" >> "$GITHUB_OUTPUT"
            echo "changed=manual dispatch" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [[ "$EVENT" == "pull_request" ]]; then
            git fetch --no-tags --depth=200 origin "$BASE" || true
            base="origin/$BASE"
          else
            base="$BEFORE"
            if [[ ! "$base" =~ ^[0-9a-f]{40}$ || "$base" =~ ^0+$ ]]; then
              base="HEAD~1"
            fi
          fi
          # ## One invocation, two streams
          #
          # `--print-files` puts the path list on stdout and the prose verdict on stderr,
          # so a single run of the classifier produces both facts. The previous version
          # ran the classifier once and then a *second* `git diff` for the list, with this
          # redirect:
          #
          #   git diff --name-only "$base"...HEAD 2>/dev/null || true >> "$GITHUB_OUTPUT"
          #
          # `>>` binds to the last command in the `||` list — `true` — so the diff went to
          # the job log and `changed` was **always empty**. Measured in a scratch repo with
          # one changed file: the buggy form captured nothing, the fixed form captured it.
          #
          # Two diffs that must agree, with nothing comparing them, was the deeper
          # problem: a rename could be classified as code-changing and published as
          # docs-only in the same run.
          #
          # `set -e` is off for this call because a non-zero exit from the classifier
          # means "could not determine the diff", which is `docs_only=false` — the safe
          # answer, not a reason to abort the job before `required` can report.
          set +e
          node scripts/classify-change.mjs . "$base" HEAD --print-files \
            > /tmp/changed.txt 2> /tmp/classify.log
          status=$?
          set -e
          cat /tmp/classify.log
          verdict="$(sed -n 's/^docs_only=//p' /tmp/classify.log | tail -1)"
          if [[ "$status" -ne 0 || -z "$verdict" ]]; then
            echo "classifier could not decide (exit $status); treating as not docs-only" >&2
            verdict="false"
            : > /tmp/changed.txt
          fi
          echo "docs_only=$verdict" >> "$GITHUB_OUTPUT"
          # ## The heredoc delimiter
          #
          # `EOF` was the old delimiter, and a file legitimately named `EOF` would end the
          # block early and truncate the list. `CHANGED_EOF_SENTINEL` cannot collide with a
          # repository path in practice, and `git` itself allows a file named `EOF`.
          {
            echo "changed<<CHANGED_EOF_SENTINEL"
            cat /tmp/changed.txt
            echo "CHANGED_EOF_SENTINEL"
          } >> "$GITHUB_OUTPUT"
          echo "changed file(s): $(wc -l < /tmp/changed.txt | tr -d ' ')"

  frontend:
    name: Frontend quality
    # Docs-only changes skip this job; `CI / required` still reports, and its
    # docs-only branch is what keeps a README edit mergeable.
    needs: changes
    if: needs.changes.outputs.docs_only != 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter=@terminal/frontend lint
      - run: pnpm --filter=@terminal/frontend typecheck
      # ## Machine-readable results, so the test report is measured rather than guessed
      #
      # `--reporter=json --outputFile` writes vitest's own counts. The default
      # reporter's "255 files / 2337 passed" line is prose: a report built from it
      # would have to re-parse a human sentence, and would silently miss skip/todo.
      #
      # The `if: always()` upload is what makes a *failing* suite still contribute its
      # counts — otherwise a red job would look like a job that never ran.
      - name: Frontend tests (machine-readable)
        run: |
          set -o pipefail
          mkdir -p test-results
          # ## No `--`
          #
          # `pnpm run test -- --flag` forwards the `--` **and** the flags, so vitest
          # receives `vitest run -- --reporter=json …` and treats everything after `--`
          # as positional arguments. Measured on this worktree: the full suite ran and
          # **no** JSON file was written anywhere. The `--` is only needed for npm; pnpm
          # passes extra args through directly.
          #
          # The output path is relative to vite's `root` (`packages/frontend`), so it
          # must be `../../test-results/` to reach the repo root the artifact upload
          # reads — `../test-results` lands in `packages/test-results`, which nothing
          # uploads.
          pnpm --filter=@terminal/frontend test \
            --reporter=default --reporter=json --outputFile=../../test-results/vitest.json
          # The guard is at the repo root: the shell's cwd is not changed by
          # `pnpm --filter`, so this is `test-results/`, not `../test-results/`.
          test -s test-results/vitest.json
      - name: Upload frontend test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-frontend-${{ github.run_id }}
          path: test-results/
          if-no-files-found: warn
          retention-days: 7
      - run: pnpm --filter=@terminal/frontend build:budget
      - name: Vault probe is absent from the production bundle
        run: |
          if grep -r "phase9.7-vault-one-time" packages/frontend/dist; then
            echo "smoke-only Vault probe leaked into the production build" >&2
            exit 1
          fi
      - name: Vault probe is present only with the smoke overlay
        run: |
          VITE_TERMINAL_SMOKE_BUILD=1 VITE_TERMINAL_VAULT_PROBE=1 \
            pnpm --filter=@terminal/frontend exec vite build --outDir dist-smoke
          grep -rq "phase9.7-vault-one-time" packages/frontend/dist-smoke
          rm -rf packages/frontend/dist-smoke

  frontend-audit:
    # Phase 9.2 recorded the front-end audit as NOT_RUN because the developer
    # machine's ~/.npmrc points at registry.npmmirror.com, which does not serve
    # an audit endpoint. That conclusion was about the *machine*, not the
    # project, and it hid a real result: against the public registry this
    # workspace carried 25 advisories (1 critical, 12 high), almost all through
    # overrides that had pinned patched packages to vulnerable versions. A user
    # override can silently re-introduce a CVE, so this runs on every push.
    #
    # It audits the *installed production tree*, not just this package's own
    # dependencies: a vulnerable transitive package is still shipped.
    name: Dependency audit (npm)
    # Docs-only changes skip this job; `CI / required` still reports, and its
    # docs-only branch is what keeps a README edit mergeable.
    needs: changes
    if: needs.changes.outputs.docs_only != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # No registry override: the runner talks to the public registry, which is
      # the only registry that answers the audit endpoint. A mirrored registry
      # is a development convenience and must not be able to make this pass.
      - name: Audit production dependencies
        run: |
          pnpm audit --prod --registry https://registry.npmjs.org 2>&1 | tee audit.log
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            echo "::error::production dependency audit reported findings; see audit.log"
            exit 1
          fi

  team-server:
    name: Team Server quality
    # Docs-only changes skip this job; `CI / required` still reports, and its
    # docs-only branch is what keeps a README edit mergeable.
    needs: changes
    if: needs.changes.outputs.docs_only != 'true'
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: terminal_ci
          POSTGRES_PASSWORD: ci-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d terminal_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:ci-password@127.0.0.1:5432/terminal_ci
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter=team-server exec prisma validate
      - run: pnpm --filter=team-server prisma:generate
      - run: pnpm --filter=team-server typecheck
      - run: pnpm --filter=team-server lint
      - name: Team Server tests (machine-readable)
        run: |
          set -o pipefail
          mkdir -p test-results
          # Same two corrections as the frontend job: no `--` (pnpm forwards it, and
          # vitest then ignores the flags), and the path is relative to vite's root
          # (`packages/team-server`) so it needs `../../test-results/`.
          pnpm --filter=team-server test \
            --reporter=default --reporter=json --outputFile=../../test-results/team-server-vitest.json
          test -s test-results/team-server-vitest.json
      - name: Upload Team Server test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-team-server-${{ github.run_id }}
          path: test-results/
          if-no-files-found: warn
          retention-days: 7
      - run: pnpm --filter=team-server build
      - name: Apply migrations
        working-directory: packages/team-server
        run: pnpm exec prisma migrate deploy
      - name: Verify migrated database matches schema
        working-directory: packages/team-server
        run: >-
          pnpm exec prisma migrate diff
          --from-config-datasource
          --to-schema prisma/schema.prisma
          --exit-code
      # Real-PostgreSQL concurrency suite: two independent connection pools act as
      # two clients, one external lock holder proves writers really block. It is
      # kept out of the default 'test' script because it needs a live server, so
      # it runs here where the postgres service is already up.
      - name: Team Server concurrency suite (real PostgreSQL)
        working-directory: packages/team-server
        env:
          TEAM_SERVER_TEST_DATABASE_URL: postgresql://postgres:ci-password@127.0.0.1:5432/team_server_concurrency_test
        run: pnpm exec vitest run --config vitest.pg.config.ts
      # Cross-version acceptance: the released v0.0.1-dev.2 client (materialised
      # from the tag, not re-built from HEAD) and the current client, in separate
      # processes, against this server over real HTTP and PostgreSQL. The step is
      # currently a diagnostic, not a gate: it has already recorded that the
      # historical client cannot re-sync against the current server, and a red
      # step exists to keep that finding visible. Making it blocking is the job
      # of the fix, not of the harness.
      - name: Fetch the historical client tag
        run: git fetch --depth 1 origin refs/tags/v0.0.1-dev.2:refs/tags/v0.0.1-dev.2
      - name: Team Sync cross-version acceptance (diagnostic)
        continue-on-error: true
        env:
          TEAM_SERVER_TEST_DATABASE_URL: postgresql://postgres:ci-password@127.0.0.1:5432/team_server_cross_version_test
          TEAM_SYNC_E2E_REPORT: team-cross-version-report.json
        run: node scripts/verify-install/team-cross-version.mjs
      - name: Show cross-version report
        if: always()
        run: cat team-cross-version-report.json || true
      - name: Upload cross-version report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: team-sync-cross-version-report
          path: team-cross-version-report.json
          if-no-files-found: warn

  zsh-probe-diagnostic:
    # Evidence for the Linux zsh timeouts. The standalone workflow file could not
    # be dispatched because GitHub only registers workflows present on the default
    # branch, so it lives here where it also runs on every push. It is cheap: it
    # starts shells, it does not build the app.
    name: zsh probe diagnostic
    # Docs-only changes skip this job; `CI / required` still reports, and its
    # docs-only branch is what keeps a README edit mergeable.
    needs: changes
    if: needs.changes.outputs.docs_only != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # This job collects evidence; it does not validate the product. Its script
    # exits 1 whenever any variant fails, and "zsh plain + readline-history" is
    # a standing finding on Ubuntu runners rather than a regression. Gating the
    # build on it would keep CI red for a known result and teach people to
    # ignore the job. The product gate is the shell-probe step inside
    # real-machine-matrix.yml; this job only has to produce the transcript.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - name: Install shells
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends zsh bash
      - name: Record shell versions
        run: |
          echo "zsh: $(zsh --version)"
          echo "bash: $(bash --version | head -1)"
      - name: Run the rc matrix and capture transcripts
        run: |
          mkdir -p diagnostic-out
          python3 scripts/diagnose-zsh-rc.py --shells zsh,bash --out diagnostic-out/zsh-diag.log
      - name: Show the transcript
        if: always()
        run: cat diagnostic-out/zsh-diag.log || true
      - name: Upload transcripts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: zsh-probe-diagnostic
          path: diagnostic-out/
          if-no-files-found: warn

  source-size:
    # Two gates share this job because both are cheap, offline, and about the
    # repository rather than the product build.
    #
    # `check:source-size` enforces the per-file line limits.
    #
    # `check-verification-evidence` is the one that used to be bypassable. It was
    # reachable only through `pnpm verify`, which nothing in CI ran, so a commit
    # could change product sources and leave six evidence files describing an
    # older checkout with no job going red. It now runs on every push, and it
    # fails when an evidence file's recorded source fingerprint does not match
    # the tree: that is not a formatting complaint, it means the measurement on
    # file was taken against different code.
    #
    # Tests for the gate scripts themselves run here too (the glob is collected
    # from disk, so a new scripts/*.test.mjs is picked up without editing this).
    # The verify-install upgrade harness tests live one level down because they
    # exercise the same installer fixtures as the platform scripts.
    name: Repository gates (source size, evidence, script tests)
    # Docs-only changes skip this job; `CI / required` still reports, and its
    # docs-only branch is what keeps a README edit mergeable.
    needs: changes
    if: needs.changes.outputs.docs_only != 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check:source-size
      # ## Integrity, not qualification
      #
      # This job runs on every PR, so it asks the question a PR can answer: **is the
      # evidence internally trustworthy?** — schema, manifest completeness, raw logs
      # present, binary hashes agreeing with the manifest, run id matching, no run
      # mixing, no fabricated PASS.
      #
      # It deliberately does **not** compare against the current tree. Six files
      # captured on an older commit are valid evidence of that commit; requiring them
      # to match every newer commit made this job red on every branch for months
      # (measured 2026-11-15: seven problems on `main`, all "recorded against
      # fingerprint d45be813…") and buried a genuine evidence problem inside the noise.
      #
      # The strict question — "does this evidence describe the checkout we are about
      # to release?" — belongs to `release.yml`, which runs
      # `--mode=qualification`. Dropping it there would let a release ship evidence of
      # different code; dropping it here costs nothing, because a release cannot happen
      # without that job.
      #
      # Still not advisory: `continue-on-error` on either mode would recreate the gap
      # this job was widened to close.
      - name: Verification evidence is internally consistent
        run: node scripts/check-verification-evidence.mjs --mode=integrity
      - name: Gate script tests (machine-readable)
        run: |
          set -o pipefail
          mkdir -p test-results
          node --test --test-reporter=spec --test-reporter-destination=stderr \
            --test-reporter=tap --test-reporter-destination=test-results/scripts.tap \
            scripts/*.test.mjs scripts/verify-install/*.test.mjs
      - name: Upload gate script test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-scripts-${{ github.run_id }}
          path: test-results/
          if-no-files-found: warn
          retention-days: 7

  rust:
    name: Rust quality
    # Docs-only changes skip this job; `CI / required` still reports, and its
    # docs-only branch is what keeps a README edit mergeable.
    needs: changes
    if: needs.changes.outputs.docs_only != 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Tauri Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            build-essential \
            curl \
            file \
            libayatana-appindicator3-dev \
            libssl-dev \
            libudev-dev \
            libwebkit2gtk-4.1-dev \
            librsvg2-dev \
            patchelf \
            libxdo-dev
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.96.0
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
      # `--all-features` includes `custom-protocol`, which makes
      # `generate_context!` embed `frontendDist` instead of falling back to a dev
      # server. That macro reads `../dist` at compile time and panics when the
      # directory is absent: "The `frontendDist` configuration is set to
      # \"../dist\" but this path doesn't exist". This job never built the
      # frontend, so it must now do so — the dependency is real, not avoidable by
      # order of steps: without `custom-protocol` the crate would compile to a
      # binary that cannot render (grey window), which is what this gate exists
      # to prevent. A bare `vite build` is enough; the budget check is the
      # frontend job's business.
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build the frontend that `custom-protocol` embeds
        run: pnpm --filter=@terminal/frontend build
      - run: cargo fmt --manifest-path src-tauri/Cargo.toml --check
      - run: cargo check --locked --manifest-path src-tauri/Cargo.toml --all-targets --all-features
      - run: cargo clippy --locked --manifest-path src-tauri/Cargo.toml --all-targets --all-features -- -D warnings
      # ## Is the AI transport actually gated?
      #
      # `07-ux4-ai-inspector.md` §4 puts the model request behind a non-default
      # feature, and the guarantee that matters is "a build without it has no path to
      # a model — not a disabled one, an absent one". A comment saying the feature
      # gates the module is not evidence. This builds the crate twice into separate
      # target dirs (so a stale artifact cannot answer for either) and asserts the
      # AI module's marker strings are in the feature-on library and absent from the
      # feature-off one. It also checks the feature is not a default and that
      # `tauri.conf.json` enables it for the product build.
      #
      # Not advisory: a feature that silently stopped gating would put the transport
      # back into every build while every other job stayed green.
      - name: AI transport is absent without the `ai` feature
        run: node scripts/check-ai-isolation.mjs
      # ## Machine-readable libtest counts
      #
      # `cargo test` writes one `test result: …` line per test binary, and a workspace
      # runs several. The file is kept verbatim; `ci-test-ingest.mjs` sums the lines.
      # Tee rather than redirect so a failure is still visible in the job log.
      - name: Rust tests (machine-readable)
        run: |
          set -o pipefail
          mkdir -p src-tauri/test-results
          cargo test --locked --manifest-path src-tauri/Cargo.toml 2>&1 \
            | tee src-tauri/test-results/cargo-test.txt
      - name: Upload Rust test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-rust-${{ github.run_id }}
          path: src-tauri/test-results/
          if-no-files-found: warn
          retention-days: 7
      - run: cargo test --locked --manifest-path src-tauri/Cargo.toml --features smoke-vault-probe vault_probe
      # ## The production SFTP paths against a real OpenSSH server
      #
      # `staged_upload` and `receive_download` are what the `#[tauri::command]`
      # handlers call, and their tests are `#[ignore]` because they need a server.
      # Measured: until this step existed, `scripts/verify-install/sftp-command-e2e.mjs`
      # and `sftp-staged-upload-e2e.mjs` appeared in `package.json` and nowhere under
      # `.github/`, so the only tests that exercise the real byte path never ran in CI.
      #
      # The runner starts a throwaway sshd on 127.0.0.1 with its own host key and user
      # key, runs the ignored tests, and removes the fixture. It exits non-zero when
      # sshd never listened, so a missing server is a failure rather than a silent
      # skip of the only tests that move real bytes.
      #
      # What this does **not** prove: the Tauri command wrappers, the frontend
      # transfer queue, or any GUI. Those are different layers with their own suites,
      # and conflating them is the mistake this comment exists to prevent.
      - name: SFTP command-level acceptance (real sshd)
        env:
          SFTP_E2E_REPORT: test-results/sftp-command-e2e.txt
        run: |
          mkdir -p test-results
          node scripts/verify-install/sftp-command-e2e.mjs
      - name: Upload SFTP command-level results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-sftp-command-${{ github.run_id }}
          path: test-results/
          if-no-files-found: warn
          retention-days: 7

  cargo-audit:
    # RustSec sweep over src-tauri/Cargo.lock, as a REAL GATE.
    #
    # Phase 9.1 ran this by hand and found 27 advisories nobody in CI was
    # watching for. The first attempt at automating it (this job, previously
    # named cargo-audit-diagnostic) set `continue-on-error: true`, and the count
    # then drifted 27 -> 25 with no one noticing. Phase 9.2 replaces that with
    # scripts/security-gate.mjs, which separates three outcomes CI must not
    # conflate:
    #
    #   exit 0 - every advisory is recorded in src-tauri/security-baseline.json
    #   exit 1 - a new advisory, or a recorded one on a new version
    #   exit 2 - the scan itself failed (no advisory db, broken output)
    #
    # All three fail this job except 0. A recorded advisory is not "ignored":
    # each carries the reason it could not be fixed and the cargo tree command
    # that re-checks it. The baseline is a ratchet - it shrinks without review,
    # and grows only on a deliberate, reviewable diff.
    #
    # Why not cargo-deny, which this job used to run: cargo-deny's ignore list is
    # keyed by advisory id alone. RUSTSEC-2023-0071 fires against rsa 0.9.10 (not
    # in the graph) AND rsa 0.10.0-rc.18 (in the graph via russh, no upstream
    # fix). Ignoring it to quiet the first silences the second, which is exactly
    # the "widen the ignore list until it is green" move this phase forbids.
    # security-gate.mjs keys on kind+id+crate+version, so the residue can be
    # recorded while the live exposure stays visible and named.
    #
    # It also covers the classes cargo-deny would flag and cargo audit splits
    # into `warnings`: unsound, unmaintained and yanked crates are all findings.
    # src-tauri/deny.toml is kept as documentation of the same decisions for
    # anyone running cargo-deny by hand, but it is not a CI gate and must not be
    # treated as one.
    #
    # What this does NOT claim: the baseline records 13 advisories. Seven are
    # lock-file residue absent from every build graph, five are real but
    # Linux-only (Tauri's tray/notification stack, absent from the macOS and
    # Windows graphs), and one (rsa 0.10.0-rc.18) is live on all three platforms
    # with no fixed release upstream. Green here means "no unrecorded advisory",
    # not "no known vulnerabilities". See docs/phase9-2/security-remediation.md.
    name: cargo audit (blocking)
    # Docs-only changes skip this job; `CI / required` still reports, and its
    # docs-only branch is what keeps a README edit mergeable.
    needs: changes
    if: needs.changes.outputs.docs_only != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.96.0
      # Pinned, prebuilt binaries: `cargo install cargo-audit` from source adds
      # minutes to a job whose whole point is to be cheap enough to always run.
      - name: Install cargo-audit
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit@0.22.2
      - name: Record tool and advisory-db versions
        run: cargo audit --version
      - name: Fetch the crates.io registry index
        # cargo audit needs the *registry index* in the local cargo home to answer
        # "was this exact version yanked?". Without it, it prints "couldn't check
        # if the package is yanked" for every crate on stderr and still exits 1
        # with a JSON report whose warnings.yanked key is simply absent -- which
        # reads as "no yanked crates" unless something checks the log (P9.3.1
        # P1-1). `cargo fetch` populates the sparse index without compiling, so
        # this costs seconds rather than the minutes a build would take.
        working-directory: src-tauri
        run: cargo fetch --locked
      # The runner has no advisory-db yet, so this clone is the fetch. It is
      # kept as its own step so an advisory-db outage reads as "could not fetch
      # the database" instead of being misreported as "no vulnerabilities".
      - name: Fetch the RustSec advisory database
        id: fetch-db
        run: |
          git clone --depth 1 https://github.com/RustSec/advisory-db.git "$RUNNER_TEMP/advisory-db"
          echo "db-commit=$(git -C "$RUNNER_TEMP/advisory-db" rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          git -C "$RUNNER_TEMP/advisory-db" log -1 --format='advisory-db %H %ad' --date=iso
      # --no-fetch: the clone above is the only fetch, so the audit cannot
      # silently run against a different database than the one recorded.
      #
      # `|| true` here does NOT swallow a failure: it only lets the job continue
      # so the gate below can classify the result. cargo audit exits 1 whenever
      # it finds any advisory, which is the normal case for this repo today.
      # If the audit *failed*, the file is empty or unparseable and
      # security-gate.mjs exits 2.
      - name: cargo audit (JSON)
        working-directory: src-tauri
        run: |
          mkdir -p "$GITHUB_WORKSPACE/security-scan"
          set +e
          # stderr is captured on purpose: when the crates.io registry index is
          # absent from the cargo home, cargo audit reports "couldn't check if
          # the package is yanked" per crate on stderr and still exits 1 with a
          # valid report in which warnings.yanked is simply missing. That looks
          # like "no crate is yanked" unless the log is read (P9.3.1 P1-1).
          cargo audit \
            --db "$RUNNER_TEMP/advisory-db" \
            --no-fetch \
            --json \
            > "$GITHUB_WORKSPACE/security-scan/cargo-audit.json" \
            2> "$GITHUB_WORKSPACE/security-scan/cargo-audit.stderr"
          audit_exit=$?
          set -e
          echo "cargo audit exited $audit_exit (1 means advisories were found, which the gate then rates)"
          # Anything other than 0/1 is a scan failure: the gate must see it.
          case "$audit_exit" in
            0|1) ;;
            *) echo "::error::cargo audit failed with exit $audit_exit; this is not a clean result"; exit 1 ;;
          esac
          test -s "$GITHUB_WORKSPACE/security-scan/cargo-audit.json"
      # THE GATE. Exit 1 (unrecorded advisory) and exit 2 (scan failed) both fail
      # the job; only exit 0 passes.
      - name: Rate the scan against the baseline
        run: |
          node scripts/security-gate.mjs \
            --audit security-scan/cargo-audit.json \
            --audit-log security-scan/cargo-audit.stderr \
            --baseline src-tauri/security-baseline.json
      - name: Rebuild the ledger from this run's audit JSON
        if: always()
        run: |
          node scripts/build-security-ledger.mjs \
            --input security-scan/cargo-audit.json \
            || echo "::warning::build-security-ledger.mjs --input failed; see the log"
          for f in security-advisories.md security-advisories.json; do
            if [ -f "docs/phase9-1/$f" ]; then
              cp "docs/phase9-1/$f" "security-scan/regenerated-$f"
            fi
          done
          git --no-pager diff --stat -- docs/phase9-1/ || true
          git --no-pager diff -- docs/phase9-1/ \
            > security-scan/ledger-drift.diff || true
      - name: Upload the security scan evidence
        # always(): a failed step above is exactly when the JSON is needed.
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cargo-audit
          path: security-scan/
          if-no-files-found: warn

  docker:
    name: Team Server container
    # Docs-only changes skip this job; `CI / required` still reports, and its
    # docs-only branch is what keeps a README edit mergeable.
    needs: changes
    if: needs.changes.outputs.docs_only != 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate Compose file
        env:
          DATABASE_URL: postgresql://terminal:ci-password@db:5432/terminal
          POSTGRES_PASSWORD: ci-password
          CORS_ORIGINS: https://ci.invalid
        run: docker compose -f packages/team-server/docker-compose.yml config --quiet
      - name: Build image
        run: docker build --file packages/team-server/Dockerfile --tag terminal-team-server:ci .

  tauri:
    name: Tauri build (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest]
    # Docs-only changes skip this job; `CI / required` still reports, and its
    # docs-only branch is what keeps a README edit mergeable.
    needs: changes
    if: needs.changes.outputs.docs_only != 'true'
    runs-on: ${{ matrix.os }}
    env:
      # Where every verification script writes its evidence snapshots; the upload
      # step below collects them even when a step fails.
      VERIFY_INSTALL_EVIDENCE: ${{ github.workspace }}/verify-install-evidence
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.96.0
      # ## The one measurable cost win
      #
      # Measured on run 43814394847: `Tauri build (windows-latest)` takes **17.1 min**
      # and is the critical path — the next longest job is 10.6 min and everything runs
      # in parallel from +0.3 min. This job had no Rust cache at all (only the `rust`
      # job did), so all three platforms recompiled the whole dependency graph on every
      # run.
      #
      # `Swatinem/rust-cache` keys on Cargo.lock plus the toolchain, and it is scoped per
      # `workspaces:` and per OS by default, so the three matrix legs do not share a
      # cache (they cannot — the artifacts differ per platform).
      - uses: Swatinem/rust-cache@v2
        with:
          # No custom `key:`: the action already scopes by OS and hashes Cargo.lock, and
          # an explicit key would defeat its `restore-keys` fallback, so a branch could
          # not reuse the main branch's warm cache. The `rust` job uses the same shape.
          workspaces: src-tauri -> target
      - name: Install Tauri Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            build-essential \
            curl \
            file \
            libayatana-appindicator3-dev \
            libssl-dev \
            libudev-dev \
            libwebkit2gtk-4.1-dev \
            librsvg2-dev \
            patchelf \
            libxdo-dev
      - run: pnpm install --frozen-lockfile
      # Native Windows recovery tests: directory flush, marker roundtrip and
      # the Windows-only cfg paths, on a real NTFS runner with a temp profile.
      - name: Windows native recovery tests
        if: runner.os == 'Windows'
        run: cargo test --locked --manifest-path src-tauri/Cargo.toml --lib db_recovery
      - run: pnpm tauri build --no-bundle --ci -- --locked
      # Phase 8.8 Task E1: produce the installers that the install-chain steps
      # below consume. `tauri bundle` reuses the release binary from the build
      # step, so this does not compile twice. Bundling stays a separate step from
      # the --no-bundle compile gate so a packaging regression and a compile
      # regression stay distinguishable in the job log.
      - name: Bundle installer (macOS DMG + .app)
        if: runner.os == 'macOS'
        run: |
          pnpm tauri bundle --bundles app
          if ! pnpm tauri bundle --bundles dmg; then
            echo "::warning::DMG bundling failed once; retrying (create-dmg on runners is known to be flaky)"
            pnpm tauri bundle --bundles dmg
          fi
      - name: Bundle installer (Windows NSIS)
        if: runner.os == 'Windows'
        # Same upstream download (nsis-*.zip from tauri-apps/binary-releases),
        # same intermittent 502/504. Bounded retries, then a real failure.
        run: |
          for attempt in 1 2 3 4; do
            if pnpm tauri bundle --bundles nsis; then
              exit 0
            fi
            if [ "$attempt" = 4 ]; then
              echo "::error::NSIS bundling failed after 4 attempts (upstream tauri-apps/binary-releases was returning 502/504 in earlier runs)"
              exit 1
            fi
            echo "::warning::bundling failed (attempt $attempt/4); retrying in $((attempt * 20))s"
            sleep $((attempt * 20))
          done
        shell: bash
      - name: Bundle installer (Linux deb + AppImage)
        if: runner.os == 'Linux'
        # `tauri bundle` downloads AppRun from tauri-apps/binary-releases, and
        # that host intermittently answers 502/504 (observed 2026-11-08 on
        # several runs). The download is retried here with a bounded backoff;
        # if the host stays down the step still fails, so a packaging failure is
        # never reported as a pass. The three retries are enough to ride out the
        # short blips seen so far, which lasted seconds to a couple of minutes.
        run: |
          for attempt in 1 2 3 4; do
            if pnpm tauri bundle --bundles deb,appimage; then
              exit 0
            fi
            if [ "$attempt" = 4 ]; then
              echo "::error::AppImage/deb bundling failed after 4 attempts (upstream tauri-apps/binary-releases was returning 502/504 in earlier runs)"
              exit 1
            fi
            echo "::warning::bundling failed (attempt $attempt/4); retrying in $((attempt * 20))s"
            sleep $((attempt * 20))
          done
      - name: Install Xvfb and the desktop-file validator (Linux)
        if: runner.os == 'Linux'
        # x11-utils provides xdpyinfo, which the verification script uses to
        # prove the headless X server is really up before it launches the app.
        run: sudo apt-get install -y --no-install-recommends xvfb x11-utils desktop-file-utils
      # Every step below exits non-zero on a failed assertion; none of them is
      # allowed to swallow a failure with `|| true`. A check the runner genuinely
      # cannot perform is printed as [SKIPPED]/[NOT_RUN] with its reason in the
      # job log, never as a pass - see docs/release/phase8-task-e-rc-acceptance.md.
      #
      # Phase 8.9 Task 5: these scripts no longer settle for "the directory
      # exists". Each one launches the installed app against an isolated user
      # data root, writes controlled rows (a host without any credential, the
      # app_settings row, a workspace with its layout, a test vault file), then
      # overwrite-installs and relaunches the app and reads every asserted field
      # back. The evidence JSON is the snapshot each run compares against, and
      # the app's own boot-time write-back into the seeded settings row is what
      # proves the data was read, not merely left on disk.
      - name: Verify install chain + data retention (macOS DMG)
        if: runner.os == 'macOS'
        run: bash scripts/verify-install-macos.sh
      - name: Parse the PowerShell verification script
        # This machine cannot parse PowerShell, so the only way to catch a
        # syntax error before it fails the real step is to ask the runner that
        # has a parser. Without this, a missing brace surfaces as a generic
        # exit 1 with no useful line number.
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $path = Join-Path $env:GITHUB_WORKSPACE 'scripts/verify-install-windows.ps1'
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile($path, [ref]$null, [ref]$errors) | Out-Null
          if ($errors) {
            $errors | ForEach-Object { Write-Host ($_.Extent.StartLineNumber.ToString() + ': ' + $_.Message) }
            throw ('scripts/verify-install-windows.ps1 does not parse: ' + $errors.Count + ' error(s)')
          }
          Write-Host 'scripts/verify-install-windows.ps1 parses cleanly'

      - name: Verify install chain + data retention (Windows NSIS)
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/verify-install-windows.ps1
      - name: Verify install chain + data retention (Linux deb + AppImage)
        if: runner.os == 'Linux'
        run: bash scripts/verify-install-linux.sh
      # The uploaded snapshots are the pre-install baseline each run asserts
      # against; they are evidence, not a gate input.
      - name: Upload the data-retention evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: install-data-retention-${{ matrix.os }}
          path: verify-install-evidence/
          if-no-files-found: warn

  # ## The one check branch protection can require
  #
  # Before this job there was nothing to require: `ci.yml` had eleven jobs and no
  # aggregator, so a ruleset could only list them by name — and `paths-ignore` means
  # a docs-only PR never creates those check runs at all. A required check that never
  # reports is a permanently pending PR.
  #
  # `CI / required` always runs and always reports. It decides from what actually ran:
  #
  #   * an **expected** job that succeeded → fine;
  #   * an expected job that was **skipped** → fine only if `optional: true` in the
  #     table below, or if the whole workflow was a docs-only run;
  #   * failure, cancelled, or a missing result → fail.
  #
  # `needs.*.result == 'success'` alone is not enough, for two reasons that are both
  # observable in this repository's history:
  #
  #   1. `paths-ignore` turns a docs-only push into a run where every job is
  #      `skipped`. A naive aggregator would either fail that (wrong: nothing
  #      regressed) or pass it without saying so (worse: a silent pass).
  #   2. A dependency that is itself skipped cascades `skipped` to its dependents, so
  #      "not failed" and "ran" are different questions.
  #
  # The table below is the contract: it names every job and whether its absence is
  # acceptable. Adding a job without adding it here does not silently weaken the
  # gate — `verify-required-checks.mjs` compares the table against `ci.yml` and fails
  # on a job nobody classified.
  required:
    name: required
    needs:
      - changes
      - frontend
      - frontend-audit
      - team-server
      - source-size
      - rust
      - cargo-audit
      - docker
      - tauri
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
      - name: Aggregate
        env:
          # `toJSON(needs)` is the whole result map; passing it as one value avoids a
          # step per job and keeps the contract in one file.
          NEEDS: ${{ toJSON(needs) }}
          EVENT_NAME: ${{ github.event_name }}
          DOCS_ONLY: ${{ needs.changes.outputs.docs_only }}
        run: node scripts/verify-required-checks.mjs
      # ## Say what kind of failure this is
      #
      # "CI is red" is not actionable. The dominant failure in this repository's
      # history is stale acceptance evidence — not a code problem — and before this
      # step the only way to tell it from a regression was to open the log.
      #
      # ## The `jq` projection used to drop the job id
      #
      # It emitted `{name, conclusion, informational}` and the CLI fetched logs with
      # `actions/jobs/${job.id}/logs`. With no `id` every URL was `jobs/undefined/logs`,
      # every request 404'd, and the classifier saw an empty log for every job. On run
      # 43716684905 the Windows build failed with `error[E0433]: cannot find \`unix\` in
      # \`os\`` and the report said `UNKNOWN`.
      #
      # The projection now keeps the id, the run identity, and the step list. The field
      # names are asserted against `JOB_LIST_FIELDS` in `ci-github-api.mjs` by a test,
      # so removing one fails locally rather than in a live report.
      #
      # `informational` is decided here from the allowlist module, not by a substring of
      # the job name: `ci-informational.mjs` is the single source of which jobs may fail
      # without blocking, and a rename cannot silently change the gate.
      - name: Attribute the failure
        if: failure()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.run_id }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          # Job conclusions come from the API rather than `needs`, because `needs`
          # carries only the aggregated jobs and the attribution wants every one.
          # Paged: a matrix build can exceed the 100-job page size, and a truncated list
          # would hide a failure. `--paginate` is gh's own paging, not a second loop.
          gh api --paginate "repos/${REPO}/actions/runs/${RUN_ID}/jobs?per_page=100" \
            --jq '.jobs[] | {id, name, conclusion, status, html_url, run_id, run_attempt, steps}' \
            | jq -s '{jobs: .}' > /tmp/jobs.json
          # The conclusion comes from the run itself. `failure()` made this step run, but
          # the *run* conclusion is `failure` or `cancelled` or `timed_out`, and those
          # are different verdicts.
          RUN_CONCLUSION="$(gh api "repos/${REPO}/actions/runs/${RUN_ID}" --jq '.conclusion // ""')"
          node scripts/attribute-ci-failure.mjs \
            --jobs /tmp/jobs.json \
            --run-id "${RUN_ID}" \
            --repo "${REPO}" \
            --workflow-file .github/workflows/ci.yml \
            --required-failed true \
            --run-conclusion "${RUN_CONCLUSION}" \
            | tee -a "$GITHUB_STEP_SUMMARY"
        # A failure while explaining a failure must not replace the real verdict.
        continue-on-error: true

  # ## Aggregate the per-layer test results into one report
  #
  # Each job above uploads its runner's own machine-readable output. This job
  # downloads all of them and builds one report.
  #
  # Three rules it enforces, all of which the previous static report could not:
  #
  #   1. a missing artifact is `NOT_RUN` with the reason, never zero tests;
  #   2. a job that was skipped is `BLOCKED`, visible rather than absent;
  #   3. results from different commits never mix (the aggregator refuses them).
  #
  # `if: always()` because the report is most valuable when something failed — a
  # report that only runs on success is a report nobody needs.
  test-report:
    name: Test execution report
    needs:
      - changes
      - frontend
      - team-server
      - source-size
      - rust
    if: always() && needs.changes.outputs.docs_only != 'true'
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
      - name: Download every layer's report
        uses: actions/download-artifact@v4
        with:
          pattern: test-results-*
          path: reports
          merge-multiple: true
      # ## Every job uploads `test-results/` as its root, and `merge-multiple`
      #
      # So with `merge-multiple: true` all of them land flat in `reports/`:
      #
      #   reports/vitest.json              (frontend)
      #   reports/team-server-vitest.json  (team server)
      #   reports/scripts.tap              (gate scripts)
      #   reports/cargo-test.txt           (rust)
      #
      # The first version of this step guessed a nested layout that does not exist, so
      # the frontend report was never placed and the layer would have read NOT_RUN while
      # the job had actually produced it. Copy by exact name, and print what was found so
      # a changed artifact name shows up in the log instead of silently degrading.
      - name: Lay the reports out where the ingestion plan expects them
        run: |
          set -euo pipefail
          mkdir -p packages/frontend/test-results \
                   packages/team-server/test-results \
                   src-tauri/test-results \
                   test-results
          echo "downloaded:"; find reports -type f 2>/dev/null | sort || true
          copy_if_present() {
            if [ -f "reports/$1" ]; then
              mkdir -p "$(dirname "$2")"
              cp "reports/$1" "$2"
              echo "  $1 -> $2"
            else
              echo "  MISSING reports/$1 (the $3 layer will report NOT_RUN)"
            fi
          }
          copy_if_present vitest.json             packages/frontend/test-results/vitest.json       frontend
          copy_if_present team-server-vitest.json packages/team-server/test-results/vitest.json     team-server
          copy_if_present scripts.tap             test-results/scripts.tap                         scripts
          copy_if_present cargo-test.txt          src-tauri/test-results/cargo-test.txt            rust
      # Layers whose job did not produce a result are named, not inferred. `needs`
      # says which jobs were skipped; the aggregation maps that to BLOCKED.
      - name: Build the test execution report
        env:
          NEEDS: ${{ toJSON(needs) }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          SKIPPED_ARGS=""
          for pair in \
            "frontend:unit-frontend" \
            "team-server:unit-team-server" \
            "rust:unit-rust" \
            "source-size:scripts"; do
            job="${pair%%:*}"; layer="${pair##*:}"
            result="$(node -e "
              const needs = JSON.parse(process.env.NEEDS || '{}');
              process.stdout.write(String((needs['$job'] || {}).result || ''));
            ")"
            # ## Only `skipped` means the layer did not run
            #
            # A `failure` job still uploads its report (the artifact upload is
            # `if: always()`), and that report carries the failing suite's real counts —
            # the only numbers this report exists to publish. Marking a failed job
            # `BLOCKED` discarded them and reported zero totals.
            if [[ "$result" == "skipped" || "$result" == "" ]]; then
              SKIPPED_ARGS="$SKIPPED_ARGS --blocked $layer"
            fi
          done
          # shellcheck disable=SC2086
          node scripts/aggregate-test-report.mjs \
            --dir . \
            --sha "$HEAD_SHA" \
            --json test-results/test-execution-report.json \
            $SKIPPED_ARGS | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Upload the report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-execution-report-${{ github.run_id }}
          path: test-results/test-execution-report.json
          if-no-files-found: warn
          retention-days: 30
