name: CI

on:
  push:
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - '.workbuddy/**'
  pull_request:
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  PNPM_VERSION: 10.34.3

jobs:
  frontend:
    name: Frontend quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter=@terminal/frontend lint
      - run: pnpm --filter=@terminal/frontend typecheck
      - run: pnpm --filter=@terminal/frontend test
      - run: pnpm --filter=@terminal/frontend build:budget
      - name: Vault probe is absent from the production bundle
        run: |
          if grep -r "phase9.7-vault-one-time" packages/frontend/dist; then
            echo "smoke-only Vault probe leaked into the production build" >&2
            exit 1
          fi
      - name: Vault probe is present only with the smoke overlay
        run: |
          VITE_TERMINAL_SMOKE_BUILD=1 VITE_TERMINAL_VAULT_PROBE=1 \
            pnpm --filter=@terminal/frontend exec vite build --outDir dist-smoke
          grep -rq "phase9.7-vault-one-time" packages/frontend/dist-smoke
          rm -rf packages/frontend/dist-smoke

  frontend-audit:
    # Phase 9.2 recorded the front-end audit as NOT_RUN because the developer
    # machine's ~/.npmrc points at registry.npmmirror.com, which does not serve
    # an audit endpoint. That conclusion was about the *machine*, not the
    # project, and it hid a real result: against the public registry this
    # workspace carried 25 advisories (1 critical, 12 high), almost all through
    # overrides that had pinned patched packages to vulnerable versions. A user
    # override can silently re-introduce a CVE, so this runs on every push.
    #
    # It audits the *installed production tree*, not just this package's own
    # dependencies: a vulnerable transitive package is still shipped.
    name: Dependency audit (npm)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # No registry override: the runner talks to the public registry, which is
      # the only registry that answers the audit endpoint. A mirrored registry
      # is a development convenience and must not be able to make this pass.
      - name: Audit production dependencies
        run: |
          pnpm audit --prod --registry https://registry.npmjs.org 2>&1 | tee audit.log
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            echo "::error::production dependency audit reported findings; see audit.log"
            exit 1
          fi

  team-server:
    name: Team Server quality
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: terminal_ci
          POSTGRES_PASSWORD: ci-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d terminal_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:ci-password@127.0.0.1:5432/terminal_ci
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter=team-server exec prisma validate
      - run: pnpm --filter=team-server prisma:generate
      - run: pnpm --filter=team-server typecheck
      - run: pnpm --filter=team-server lint
      - run: pnpm --filter=team-server test
      - run: pnpm --filter=team-server build
      - name: Apply migrations
        working-directory: packages/team-server
        run: pnpm exec prisma migrate deploy
      - name: Verify migrated database matches schema
        working-directory: packages/team-server
        run: >-
          pnpm exec prisma migrate diff
          --from-config-datasource
          --to-schema prisma/schema.prisma
          --exit-code
      # Real-PostgreSQL concurrency suite: two independent connection pools act as
      # two clients, one external lock holder proves writers really block. It is
      # kept out of the default 'test' script because it needs a live server, so
      # it runs here where the postgres service is already up.
      - name: Team Server concurrency suite (real PostgreSQL)
        working-directory: packages/team-server
        env:
          TEAM_SERVER_TEST_DATABASE_URL: postgresql://postgres:ci-password@127.0.0.1:5432/team_server_concurrency_test
        run: pnpm exec vitest run --config vitest.pg.config.ts
      # Cross-version acceptance: the released v0.0.1-dev.2 client (materialised
      # from the tag, not re-built from HEAD) and the current client, in separate
      # processes, against this server over real HTTP and PostgreSQL. The step is
      # currently a diagnostic, not a gate: it has already recorded that the
      # historical client cannot re-sync against the current server, and a red
      # step exists to keep that finding visible. Making it blocking is the job
      # of the fix, not of the harness.
      - name: Fetch the historical client tag
        run: git fetch --depth 1 origin refs/tags/v0.0.1-dev.2:refs/tags/v0.0.1-dev.2
      - name: Team Sync cross-version acceptance (diagnostic)
        continue-on-error: true
        env:
          TEAM_SERVER_TEST_DATABASE_URL: postgresql://postgres:ci-password@127.0.0.1:5432/team_server_cross_version_test
          TEAM_SYNC_E2E_REPORT: team-cross-version-report.json
        run: node scripts/verify-install/team-cross-version.mjs
      - name: Show cross-version report
        if: always()
        run: cat team-cross-version-report.json || true
      - name: Upload cross-version report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: team-sync-cross-version-report
          path: team-cross-version-report.json
          if-no-files-found: warn

  zsh-probe-diagnostic:
    # Evidence for the Linux zsh timeouts. The standalone workflow file could not
    # be dispatched because GitHub only registers workflows present on the default
    # branch, so it lives here where it also runs on every push. It is cheap: it
    # starts shells, it does not build the app.
    name: zsh probe diagnostic
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # This job collects evidence; it does not validate the product. Its script
    # exits 1 whenever any variant fails, and "zsh plain + readline-history" is
    # a standing finding on Ubuntu runners rather than a regression. Gating the
    # build on it would keep CI red for a known result and teach people to
    # ignore the job. The product gate is the shell-probe step inside
    # real-machine-matrix.yml; this job only has to produce the transcript.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - name: Install shells
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends zsh bash
      - name: Record shell versions
        run: |
          echo "zsh: $(zsh --version)"
          echo "bash: $(bash --version | head -1)"
      - name: Run the rc matrix and capture transcripts
        run: |
          mkdir -p diagnostic-out
          python3 scripts/diagnose-zsh-rc.py --shells zsh,bash --out diagnostic-out/zsh-diag.log
      - name: Show the transcript
        if: always()
        run: cat diagnostic-out/zsh-diag.log || true
      - name: Upload transcripts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: zsh-probe-diagnostic
          path: diagnostic-out/
          if-no-files-found: warn

  source-size:
    # Two gates share this job because both are cheap, offline, and about the
    # repository rather than the product build.
    #
    # `check:source-size` enforces the per-file line limits.
    #
    # `check-verification-evidence` is the one that used to be bypassable. It was
    # reachable only through `pnpm verify`, which nothing in CI ran, so a commit
    # could change product sources and leave six evidence files describing an
    # older checkout with no job going red. It now runs on every push, and it
    # fails when an evidence file's recorded source fingerprint does not match
    # the tree: that is not a formatting complaint, it means the measurement on
    # file was taken against different code.
    #
    # Tests for the gate scripts themselves run here too (the glob is collected
    # from disk, so a new scripts/*.test.mjs is picked up without editing this).
    # The verify-install upgrade harness tests live one level down because they
    # exercise the same installer fixtures as the platform scripts.
    name: Repository gates (source size, evidence, script tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check:source-size
      # Fails when any recorded evidence describes a different checkout than the
      # one being built. It is intentionally NOT advisory: `continue-on-error`
      # here would recreate the exact gap this job was widened to close.
      - name: Verification evidence matches this checkout
        run: node scripts/check-verification-evidence.mjs
      - run: node --test scripts/*.test.mjs scripts/verify-install/*.test.mjs

  rust:
    name: Rust quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Tauri Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            build-essential \
            curl \
            file \
            libayatana-appindicator3-dev \
            libssl-dev \
            libudev-dev \
            libwebkit2gtk-4.1-dev \
            librsvg2-dev \
            patchelf \
            libxdo-dev
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.96.0
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
      - run: cargo fmt --manifest-path src-tauri/Cargo.toml --check
      - run: cargo check --locked --manifest-path src-tauri/Cargo.toml --all-targets --all-features
      - run: cargo clippy --locked --manifest-path src-tauri/Cargo.toml --all-targets --all-features -- -D warnings
      - run: cargo test --locked --manifest-path src-tauri/Cargo.toml
      - run: cargo test --locked --manifest-path src-tauri/Cargo.toml --features smoke-vault-probe vault_probe

  cargo-audit:
    # RustSec sweep over src-tauri/Cargo.lock, as a REAL GATE.
    #
    # Phase 9.1 ran this by hand and found 27 advisories nobody in CI was
    # watching for. The first attempt at automating it (this job, previously
    # named cargo-audit-diagnostic) set `continue-on-error: true`, and the count
    # then drifted 27 -> 25 with no one noticing. Phase 9.2 replaces that with
    # scripts/security-gate.mjs, which separates three outcomes CI must not
    # conflate:
    #
    #   exit 0 - every advisory is recorded in src-tauri/security-baseline.json
    #   exit 1 - a new advisory, or a recorded one on a new version
    #   exit 2 - the scan itself failed (no advisory db, broken output)
    #
    # All three fail this job except 0. A recorded advisory is not "ignored":
    # each carries the reason it could not be fixed and the cargo tree command
    # that re-checks it. The baseline is a ratchet - it shrinks without review,
    # and grows only on a deliberate, reviewable diff.
    #
    # Why not cargo-deny, which this job used to run: cargo-deny's ignore list is
    # keyed by advisory id alone. RUSTSEC-2023-0071 fires against rsa 0.9.10 (not
    # in the graph) AND rsa 0.10.0-rc.18 (in the graph via russh, no upstream
    # fix). Ignoring it to quiet the first silences the second, which is exactly
    # the "widen the ignore list until it is green" move this phase forbids.
    # security-gate.mjs keys on kind+id+crate+version, so the residue can be
    # recorded while the live exposure stays visible and named.
    #
    # It also covers the classes cargo-deny would flag and cargo audit splits
    # into `warnings`: unsound, unmaintained and yanked crates are all findings.
    # src-tauri/deny.toml is kept as documentation of the same decisions for
    # anyone running cargo-deny by hand, but it is not a CI gate and must not be
    # treated as one.
    #
    # What this does NOT claim: the baseline records 13 advisories. Seven are
    # lock-file residue absent from every build graph, five are real but
    # Linux-only (Tauri's tray/notification stack, absent from the macOS and
    # Windows graphs), and one (rsa 0.10.0-rc.18) is live on all three platforms
    # with no fixed release upstream. Green here means "no unrecorded advisory",
    # not "no known vulnerabilities". See docs/phase9-2/security-remediation.md.
    name: cargo audit (blocking)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.96.0
      # Pinned, prebuilt binaries: `cargo install cargo-audit` from source adds
      # minutes to a job whose whole point is to be cheap enough to always run.
      - name: Install cargo-audit
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit@0.22.2
      - name: Record tool and advisory-db versions
        run: cargo audit --version
      - name: Fetch the crates.io registry index
        # cargo audit needs the *registry index* in the local cargo home to answer
        # "was this exact version yanked?". Without it, it prints "couldn't check
        # if the package is yanked" for every crate on stderr and still exits 1
        # with a JSON report whose warnings.yanked key is simply absent -- which
        # reads as "no yanked crates" unless something checks the log (P9.3.1
        # P1-1). `cargo fetch` populates the sparse index without compiling, so
        # this costs seconds rather than the minutes a build would take.
        working-directory: src-tauri
        run: cargo fetch --locked
      # The runner has no advisory-db yet, so this clone is the fetch. It is
      # kept as its own step so an advisory-db outage reads as "could not fetch
      # the database" instead of being misreported as "no vulnerabilities".
      - name: Fetch the RustSec advisory database
        id: fetch-db
        run: |
          git clone --depth 1 https://github.com/RustSec/advisory-db.git "$RUNNER_TEMP/advisory-db"
          echo "db-commit=$(git -C "$RUNNER_TEMP/advisory-db" rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          git -C "$RUNNER_TEMP/advisory-db" log -1 --format='advisory-db %H %ad' --date=iso
      # --no-fetch: the clone above is the only fetch, so the audit cannot
      # silently run against a different database than the one recorded.
      #
      # `|| true` here does NOT swallow a failure: it only lets the job continue
      # so the gate below can classify the result. cargo audit exits 1 whenever
      # it finds any advisory, which is the normal case for this repo today.
      # If the audit *failed*, the file is empty or unparseable and
      # security-gate.mjs exits 2.
      - name: cargo audit (JSON)
        working-directory: src-tauri
        run: |
          mkdir -p "$GITHUB_WORKSPACE/security-scan"
          set +e
          # stderr is captured on purpose: when the crates.io registry index is
          # absent from the cargo home, cargo audit reports "couldn't check if
          # the package is yanked" per crate on stderr and still exits 1 with a
          # valid report in which warnings.yanked is simply missing. That looks
          # like "no crate is yanked" unless the log is read (P9.3.1 P1-1).
          cargo audit \
            --db "$RUNNER_TEMP/advisory-db" \
            --no-fetch \
            --json \
            > "$GITHUB_WORKSPACE/security-scan/cargo-audit.json" \
            2> "$GITHUB_WORKSPACE/security-scan/cargo-audit.stderr"
          audit_exit=$?
          set -e
          echo "cargo audit exited $audit_exit (1 means advisories were found, which the gate then rates)"
          # Anything other than 0/1 is a scan failure: the gate must see it.
          case "$audit_exit" in
            0|1) ;;
            *) echo "::error::cargo audit failed with exit $audit_exit; this is not a clean result"; exit 1 ;;
          esac
          test -s "$GITHUB_WORKSPACE/security-scan/cargo-audit.json"
      # THE GATE. Exit 1 (unrecorded advisory) and exit 2 (scan failed) both fail
      # the job; only exit 0 passes.
      - name: Rate the scan against the baseline
        run: |
          node scripts/security-gate.mjs \
            --audit security-scan/cargo-audit.json \
            --audit-log security-scan/cargo-audit.stderr \
            --baseline src-tauri/security-baseline.json
      - name: Rebuild the ledger from this run's audit JSON
        if: always()
        run: |
          node scripts/build-security-ledger.mjs \
            --input security-scan/cargo-audit.json \
            || echo "::warning::build-security-ledger.mjs --input failed; see the log"
          for f in security-advisories.md security-advisories.json; do
            if [ -f "docs/phase9-1/$f" ]; then
              cp "docs/phase9-1/$f" "security-scan/regenerated-$f"
            fi
          done
          git --no-pager diff --stat -- docs/phase9-1/ || true
          git --no-pager diff -- docs/phase9-1/ \
            > security-scan/ledger-drift.diff || true
      - name: Upload the security scan evidence
        # always(): a failed step above is exactly when the JSON is needed.
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cargo-audit
          path: security-scan/
          if-no-files-found: warn

  docker:
    name: Team Server container
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate Compose file
        env:
          DATABASE_URL: postgresql://terminal:ci-password@db:5432/terminal
          POSTGRES_PASSWORD: ci-password
          CORS_ORIGINS: https://ci.invalid
        run: docker compose -f packages/team-server/docker-compose.yml config --quiet
      - name: Build image
        run: docker build --file packages/team-server/Dockerfile --tag terminal-team-server:ci .

  tauri:
    name: Tauri build (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      # Where every verification script writes its evidence snapshots; the upload
      # step below collects them even when a step fails.
      VERIFY_INSTALL_EVIDENCE: ${{ github.workspace }}/verify-install-evidence
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.96.0
      - name: Install Tauri Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            build-essential \
            curl \
            file \
            libayatana-appindicator3-dev \
            libssl-dev \
            libudev-dev \
            libwebkit2gtk-4.1-dev \
            librsvg2-dev \
            patchelf \
            libxdo-dev
      - run: pnpm install --frozen-lockfile
      # Native Windows recovery tests: directory flush, marker roundtrip and
      # the Windows-only cfg paths, on a real NTFS runner with a temp profile.
      - name: Windows native recovery tests
        if: runner.os == 'Windows'
        run: cargo test --locked --manifest-path src-tauri/Cargo.toml --lib db_recovery
      - run: pnpm tauri build --no-bundle --ci -- --locked
      # Phase 8.8 Task E1: produce the installers that the install-chain steps
      # below consume. `tauri bundle` reuses the release binary from the build
      # step, so this does not compile twice. Bundling stays a separate step from
      # the --no-bundle compile gate so a packaging regression and a compile
      # regression stay distinguishable in the job log.
      - name: Bundle installer (macOS DMG + .app)
        if: runner.os == 'macOS'
        run: |
          pnpm tauri bundle --bundles app
          if ! pnpm tauri bundle --bundles dmg; then
            echo "::warning::DMG bundling failed once; retrying (create-dmg on runners is known to be flaky)"
            pnpm tauri bundle --bundles dmg
          fi
      - name: Bundle installer (Windows NSIS)
        if: runner.os == 'Windows'
        # Same upstream download (nsis-*.zip from tauri-apps/binary-releases),
        # same intermittent 502/504. Bounded retries, then a real failure.
        run: |
          for attempt in 1 2 3 4; do
            if pnpm tauri bundle --bundles nsis; then
              exit 0
            fi
            if [ "$attempt" = 4 ]; then
              echo "::error::NSIS bundling failed after 4 attempts (upstream tauri-apps/binary-releases was returning 502/504 in earlier runs)"
              exit 1
            fi
            echo "::warning::bundling failed (attempt $attempt/4); retrying in $((attempt * 20))s"
            sleep $((attempt * 20))
          done
        shell: bash
      - name: Bundle installer (Linux deb + AppImage)
        if: runner.os == 'Linux'
        # `tauri bundle` downloads AppRun from tauri-apps/binary-releases, and
        # that host intermittently answers 502/504 (observed 2026-11-08 on
        # several runs). The download is retried here with a bounded backoff;
        # if the host stays down the step still fails, so a packaging failure is
        # never reported as a pass. The three retries are enough to ride out the
        # short blips seen so far, which lasted seconds to a couple of minutes.
        run: |
          for attempt in 1 2 3 4; do
            if pnpm tauri bundle --bundles deb,appimage; then
              exit 0
            fi
            if [ "$attempt" = 4 ]; then
              echo "::error::AppImage/deb bundling failed after 4 attempts (upstream tauri-apps/binary-releases was returning 502/504 in earlier runs)"
              exit 1
            fi
            echo "::warning::bundling failed (attempt $attempt/4); retrying in $((attempt * 20))s"
            sleep $((attempt * 20))
          done
      - name: Install Xvfb and the desktop-file validator (Linux)
        if: runner.os == 'Linux'
        # x11-utils provides xdpyinfo, which the verification script uses to
        # prove the headless X server is really up before it launches the app.
        run: sudo apt-get install -y --no-install-recommends xvfb x11-utils desktop-file-utils
      # Every step below exits non-zero on a failed assertion; none of them is
      # allowed to swallow a failure with `|| true`. A check the runner genuinely
      # cannot perform is printed as [SKIPPED]/[NOT_RUN] with its reason in the
      # job log, never as a pass - see docs/release/phase8-task-e-rc-acceptance.md.
      #
      # Phase 8.9 Task 5: these scripts no longer settle for "the directory
      # exists". Each one launches the installed app against an isolated user
      # data root, writes controlled rows (a host without any credential, the
      # app_settings row, a workspace with its layout, a test vault file), then
      # overwrite-installs and relaunches the app and reads every asserted field
      # back. The evidence JSON is the snapshot each run compares against, and
      # the app's own boot-time write-back into the seeded settings row is what
      # proves the data was read, not merely left on disk.
      - name: Verify install chain + data retention (macOS DMG)
        if: runner.os == 'macOS'
        run: bash scripts/verify-install-macos.sh
      - name: Parse the PowerShell verification script
        # This machine cannot parse PowerShell, so the only way to catch a
        # syntax error before it fails the real step is to ask the runner that
        # has a parser. Without this, a missing brace surfaces as a generic
        # exit 1 with no useful line number.
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $path = Join-Path $env:GITHUB_WORKSPACE 'scripts/verify-install-windows.ps1'
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile($path, [ref]$null, [ref]$errors) | Out-Null
          if ($errors) {
            $errors | ForEach-Object { Write-Host ($_.Extent.StartLineNumber.ToString() + ': ' + $_.Message) }
            throw ('scripts/verify-install-windows.ps1 does not parse: ' + $errors.Count + ' error(s)')
          }
          Write-Host 'scripts/verify-install-windows.ps1 parses cleanly'

      - name: Verify install chain + data retention (Windows NSIS)
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/verify-install-windows.ps1
      - name: Verify install chain + data retention (Linux deb + AppImage)
        if: runner.os == 'Linux'
        run: bash scripts/verify-install-linux.sh
      # The uploaded snapshots are the pre-install baseline each run asserts
      # against; they are evidence, not a gate input.
      - name: Upload the data-retention evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: install-data-retention-${{ matrix.os }}
          path: verify-install-evidence/
          if-no-files-found: warn
