name: Upgrade E2E

# Real two-version upgrade, deliberately separate from the normal CI install
# jobs: it downloads two published installers and runs A -> seed -> B -> verify.
# A normal push must not pay this cost; path filters keep it to the upgrade
# harness and this workflow.
on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/verify-install/**'
      - '.github/workflows/upgrade-e2e.yml'

permissions:
  contents: read

env:
  PNPM_VERSION: 10.34.3

jobs:
  macos-upgrade:
    name: macOS A->B upgrade
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24.16.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: Download published A and B installers
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p upgrade-assets/dev1 upgrade-assets/dev2
          gh release download v0.0.1-dev.1 \
            -p 'Terminal_0.0.1-dev.1_macos-aarch64.dmg' \
            -p 'SHA256SUMS.txt' \
            -D upgrade-assets/dev1 --clobber
          gh release download v0.0.1-dev.2 \
            -p 'Terminal_0.0.1-dev.2_macos-aarch64.dmg' \
            -p 'SHA256SUMS.txt' \
            -D upgrade-assets/dev2 --clobber

      - name: Verify release digests before installing
        run: |
          set -euo pipefail
          (cd upgrade-assets/dev1 && grep 'macos-aarch64.dmg' SHA256SUMS.txt > expected.txt && shasum -a 256 -c expected.txt)
          (cd upgrade-assets/dev2 && grep 'macos-aarch64.dmg' SHA256SUMS.txt > expected.txt && shasum -a 256 -c expected.txt)

      - name: Run A->B upgrade with field-by-field verification
        run: |
          node scripts/verify-install/upgrade-e2e.mjs run \
            --a-installer upgrade-assets/dev1/Terminal_0.0.1-dev.1_macos-aarch64.dmg \
            --b-installer upgrade-assets/dev2/Terminal_0.0.1-dev.2_macos-aarch64.dmg \
            --platform darwin \
            --expect-a-sha256 73cf7483e912af33c34791a50aaae378cd85ca3be6b0fccf9e8bd4fcea56a7b8 \
            --expect-b-sha256 2c9a0ca3af22ac797f732889e27b887e6fd5921f7b583f59e3ba6f64a024e1d5 \
            --expect-a-version 0.0.1-dev.1 \
            --expect-b-version 0.0.1-dev.2 \
            --expect-identifier com.baicie.termius \
            --expect-new-host-columns agent_forwarding,shell_integration \
            --work-dir upgrade-work \
            --report-dir upgrade-report

      - name: Corrupt database must be preserved
        run: |
          node scripts/verify-install/upgrade-e2e.mjs run \
            --a-installer upgrade-assets/dev1/Terminal_0.0.1-dev.1_macos-aarch64.dmg \
            --b-installer upgrade-assets/dev2/Terminal_0.0.1-dev.2_macos-aarch64.dmg \
            --platform darwin \
            --expect-a-version 0.0.1-dev.1 \
            --expect-b-version 0.0.1-dev.2 \
            --expect-identifier com.baicie.termius \
            --expect-new-host-columns agent_forwarding,shell_integration \
            --fault corrupt-db \
            --work-dir upgrade-work-corrupt --report-dir upgrade-report-corrupt

      - name: Read-only data directory must be preserved
        run: |
          node scripts/verify-install/upgrade-e2e.mjs run \
            --a-installer upgrade-assets/dev1/Terminal_0.0.1-dev.1_macos-aarch64.dmg \
            --b-installer upgrade-assets/dev2/Terminal_0.0.1-dev.2_macos-aarch64.dmg \
            --platform darwin \
            --expect-a-version 0.0.1-dev.1 \
            --expect-b-version 0.0.1-dev.2 \
            --expect-identifier com.baicie.termius \
            --expect-new-host-columns agent_forwarding,shell_integration \
            --fault read-only-data-dir \
            --work-dir upgrade-work-readonly --report-dir upgrade-report-readonly

      - name: Second B launch must be idempotent
        run: |
          node scripts/verify-install/upgrade-e2e.mjs run \
            --a-installer upgrade-assets/dev1/Terminal_0.0.1-dev.1_macos-aarch64.dmg \
            --b-installer upgrade-assets/dev2/Terminal_0.0.1-dev.2_macos-aarch64.dmg \
            --platform darwin \
            --expect-a-version 0.0.1-dev.1 \
            --expect-b-version 0.0.1-dev.2 \
            --expect-identifier com.baicie.termius \
            --expect-new-host-columns agent_forwarding,shell_integration \
            --fault restart-idempotent \
            --work-dir upgrade-work-restart --report-dir upgrade-report-restart

      - name: Upload upgrade evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: upgrade-evidence
          path: |
            upgrade-report/
            upgrade-report-corrupt/
            upgrade-report-readonly/
            upgrade-report-restart/
            upgrade-work/*/logs/
            upgrade-work-corrupt/*/logs/
            upgrade-work-readonly/*/logs/
            upgrade-work-restart/*/logs/
          if-no-files-found: warn
