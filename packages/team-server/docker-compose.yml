version: '3.8'

services:
  team-server:
    build: .
    container_name: terminal-team-server
    ports:
      - '3000:3000'
    environment:
      - DATABASE_URL=postgresql://postgres:postgres@db:5432/team_db
      - NODE_ENV=production
      - PORT=3000
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test:
        ['CMD-SHELL', 'wget -qO- http://localhost:3000/api/v1/health || exit 1']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped
    networks:
      - team-network

  db:
    image: postgres:16-alpine
    container_name: terminal-team-db
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=team_db
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - '5432:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d team_db']
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - team-network

networks:
  team-network:
    driver: bridge

volumes:
  pgdata:
