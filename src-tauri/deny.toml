# cargo-deny configuration, kept for anyone running the tool by hand.
#
# THIS IS NOT A CI GATE. The `advisories` check in .github/workflows/ci.yml runs
# scripts/security-gate.mjs against src-tauri/security-baseline.json instead.
# Reasons, both of them concrete:
#
#   1. cargo-deny's ignore list is keyed by advisory id alone, so an ignore for
#      RUSTSEC-2023-0071 (rsa) silences it for every locked version at once. That
#      advisory fires against rsa 0.9.10, which is not in the build graph, and
#      against rsa 0.10.0-rc.18, which is in the graph via russh and has no
#      upstream fix. Recording the first would hide the second; the baseline keys
#      on kind+id+crate+version so both decisions can be stated separately.
#   2. cargo-deny 0.20.2 accepts only `id` and `reason` per ignore (it rejects
#      `expiration`), so there is no way to make an exemption expire. The
#      re-review trigger has to live inside free text, which nothing enforces.
#
# security-gate.mjs has neither problem, and it also rates the crates cargo audit
# reports under `warnings` - unsound, unmaintained and yanked - not just
# vulnerabilities. Use this file to cross-check your reading of the baseline, and
# if the two ever disagree, the baseline and its gate are authoritative.
#
# Reachability method used to justify each entry below:
#
#   cd src-tauri
#   cargo tree --invert <crate>@<version> --target all --all-features
#
# That command must print `warning: nothing to print.` for the ignore to stand.
# `--target all` matters because a Windows- or Linux-only dependency is invisible
# from a macOS host without it; `--all-features` matters because CI builds with
# --all-features.
#
# Kept for hand-runs only, NOT wired into CI. See src-tauri/security-baseline.json
# for the authoritative record and docs/phase9-2/security-remediation.md for the
# per-entry evidence, including the rsa exposure this file cannot express.

[advisories]
version = 2

ignore = [
  # --- quinn-proto: 5 advisories, not in the build graph -------------------
  #
  # Residual chain: quinn-proto <- quinn <- reqwest. `reqwest 0.13.3` declares
  # quinn as an optional dependency behind its `http3` feature
  # (`http3 = ["rustls", "dep:h3", "dep:h3-quinn", "dep:quinn", ...]`). We never
  # enable `http3`, so Cargo records quinn/quinn-proto in Cargo.lock but never
  # builds them. We reach reqwest only through tauri and
  # tauri-plugin-updater, neither of which asks for HTTP/3.
  #
  # Verified unreachable: `cargo tree --invert quinn-proto --target all` and the
  # same command with `--all-features` both return `nothing to print`. The
  # intermediate `cargo tree --invert quinn --target all` also returns
  # `nothing to print`, so the whole QUIC subtree is absent, not just the leaf.
  # Control: `cargo tree --invert russh --target all` under the same flags does
  # print a chain, which shows the flags are not simply suppressing output.
  #
  # Re-review trigger: whenever reqwest's feature set changes, whenever
  # tauri-plugin-updater or tauri bumps its reqwest requirement, or if anything
  # in this workspace ever enables an HTTP/3 or QUIC feature. Enabling `http3`
  # anywhere makes all five of these live exposures immediately.
  { id = "RUSTSEC-2026-0185", reason = "quinn-proto 0.11.14 is lock-file residue, not in the build graph: quinn is an optional reqwest dep behind the unused `http3` feature. Verified by `cargo tree --invert quinn-proto --target all` and `--target all --all-features`, both `nothing to print`. Re-review when reqwest features change, when tauri/tauri-plugin-updater bumps reqwest, or if any crate here enables http3/QUIC." },
  { id = "RUSTSEC-2026-0338", reason = "quinn-proto 0.11.14 is lock-file residue, not in the build graph: quinn is an optional reqwest dep behind the unused `http3` feature. Verified by `cargo tree --invert quinn-proto --target all` and `--target all --all-features`, both `nothing to print`. Re-review when reqwest features change, when tauri/tauri-plugin-updater bumps reqwest, or if any crate here enables http3/QUIC." },
  { id = "RUSTSEC-2026-0339", reason = "quinn-proto 0.11.14 is lock-file residue, not in the build graph: quinn is an optional reqwest dep behind the unused `http3` feature. Verified by `cargo tree --invert quinn-proto --target all` and `--target all --all-features`, both `nothing to print`. Re-review when reqwest features change, when tauri/tauri-plugin-updater bumps reqwest, or if any crate here enables http3/QUIC." },
  { id = "RUSTSEC-2026-0340", reason = "quinn-proto 0.11.14 is lock-file residue, not in the build graph: quinn is an optional reqwest dep behind the unused `http3` feature. Verified by `cargo tree --invert quinn-proto --target all` and `--target all --all-features`, both `nothing to print`. Re-review when reqwest features change, when tauri/tauri-plugin-updater bumps reqwest, or if any crate here enables http3/QUIC." },
  { id = "RUSTSEC-2026-0342", reason = "quinn-proto 0.11.14 is lock-file residue, not in the build graph: quinn is an optional reqwest dep behind the unused `http3` feature. Verified by `cargo tree --invert quinn-proto --target all` and `--target all --all-features`, both `nothing to print`. Re-review when reqwest features change, when tauri/tauri-plugin-updater bumps reqwest, or if any crate here enables http3/QUIC." },

  # --- rkyv: 1 advisory, not in the build graph ---------------------------
  #
  # Residual chain: rkyv <- rust_decimal <- sqlx-core <- sqlx / tauri-plugin-sql.
  # `rust_decimal 1.41.0` declares rkyv as an optional dependency behind its
  # own `rkyv` feature (`rkyv = ["dep:rkyv"]`). Note the distinction from
  # quinn-proto: rust_decimal itself IS in the build graph (reachable via
  # sqlx-core), so the ignore does not rest on rust_decimal being absent -- it
  # rests on rust_decimal's `rkyv` feature being off. src-tauri/Cargo.toml:36
  # pins sqlx with `default-features = false, features = ["sqlite",
  # "runtime-tokio"]`, and none of that turns the feature on.
  #
  # Verified unreachable: `cargo tree --invert rkyv --target all` and the same
  # with `--all-features` both return `nothing to print`, while
  # `cargo tree --invert rust_decimal` does print the sqlx chain. That contrast
  # is the evidence: the parent is present, the advisory crate is not.
  #
  # Re-review trigger: whenever sqlx's features in src-tauri/Cargo.toml change,
  # whenever sqlx or tauri-plugin-sql is bumped, or if any dependency starts
  # enabling rust_decimal's `rkyv` / `rkyv-safe` feature.
  { id = "RUSTSEC-2026-0235", reason = "rkyv 0.7.46 is lock-file residue, not in the build graph: rkyv is an optional rust_decimal dep behind rust_decimal's unused `rkyv` feature. rust_decimal itself IS reachable via sqlx-core, so this rests on the feature being off, not the parent being absent. Verified by `cargo tree --invert rkyv@0.7.46 --target all --all-features`, which prints `nothing to print`, while `--invert rust_decimal@1.41.0` prints the sqlx chain. Re-review when sqlx features in src-tauri/Cargo.toml change, when sqlx/tauri-plugin-sql is bumped, or if anything enables rust_decimal's rkyv feature." },

  # --- rsa 0.9.10: 1 advisory, not in the build graph ---------------------
  #
  # Residual chain: rsa 0.9.10 <- sqlx-mysql <- sqlx. The project pins sqlx to
  # `default-features = false, features = ["sqlite", "runtime-tokio"]`
  # (src-tauri/Cargo.toml), so the MySQL backend is resolved into Cargo.lock but
  # never built.
  #
  # This is the version-specific half of RUSTSEC-2023-0071. The advisory also
  # fires against rsa 0.10.0-rc.18, which IS in the build graph via russh; that
  # one is deliberately absent from this list and recorded in
  # security-baseline.json instead. cargo-deny's ignore is keyed by advisory id,
  # so ignoring this id here suppresses *both* - which is exactly why
  # security-gate.mjs, not cargo-deny, is the tool that rates the build. Treat a
  # green `cargo deny` as "no unrecorded advisory of any kind other than the ones
  # the baseline already names", never as "rsa is fine".
  #
  # Re-review trigger: sqlx features change to include `mysql`; sqlx or
  # tauri-plugin-sql is bumped; or russh/ssh-key publish a release that pins a
  # different rsa version (which should retire this ignore and the baseline entry
  # together).
  { id = "RUSTSEC-2023-0071", reason = "rsa 0.9.10 is lock-file residue, not in the build graph: it comes only from sqlx-mysql (sqlx's MySQL backend), and sqlx is pinned to `default-features = false, features = [\"sqlite\", \"runtime-tokio\"]`. Verified by `cargo tree --invert rsa@0.9.10 --target all --all-features`, which prints `nothing to print`. NOTE: the same advisory is LIVE on rsa 0.10.0-rc.18 via russh and is recorded in security-baseline.json, not fixed. Re-review when sqlx features change, when sqlx/tauri-plugin-sql is bumped, or when russh/ssh-key move off rsa 0.10.0-rc.18." },
]
