[package]
name = "terminal"
version = "0.0.1-dev.2"
description = "Modern SSH/SFTP terminal client with team collaboration"
authors = ["baicie"]
license = "MIT"
edition = "2021"
rust-version = "1.96"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "terminal_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2.10", features = ["macos-private-api", "tray-icon", "image-png"] }
tauri-plugin-shell = "2"
tauri-plugin-notification = "2"
tauri-plugin-updater = "2"
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
russh = "0.60"
russh-sftp = "2.1"
ssh-key = { version = "0.6", features = ["ed25519", "rsa", "p256", "p384", "p521", "encryption"] }
tokio = { version = "1.52", features = ["full"] }
tauri-plugin-sql = { version = "2", features = ["sqlite"] }
# P8.2: the import command names the plugin's own Pool<Sqlite>, so this version
# has to stay unified with the one Cargo.lock pins (0.8.6); a second sqlx major
# or minor would make the pool type unnameable.
sqlx = { version = "0.8", default-features = false, features = ["sqlite", "runtime-tokio"] }
tauri-plugin-window-state = "2"
anyhow = "1.0"
futures = "0.3"
bytes = "1"
chrono = "0.4"
reqwest = { version = "0.13", features = ["json"] }
hmac = "0.12"
time = { version = "0.3", features = ["formatting", "parsing"] }
async-trait = "0.1"
portable-pty = "0.9"
uuid = { version = "1", features = ["v4"] }
# Encryption
sha2 = "0.10"
hex = "0.4"
aes-gcm = "0.10"
argon2 = "0.5"
rand = "0.8"
base64 = "0.22"
dirs = "6"
once_cell = "1.21"
parking_lot = "0.12"
# Atomic vault persistence: same-directory temp file + rename (cross-platform)
tempfile = "3"
zeroize = "1"
# Serial port support
serialport = "4.9"
rustix = { version = "1.1", features = ["std", "termios"] }
libc = "0.2"
tauri-plugin-global-shortcut = "2"
log = "0.4"
cfg-if = "1"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json", "fmt"] }
tracing-log = "0.2"

# Tauri's dependency graph is large. Full dependency debuginfo plus Cargo's
# incremental caches can otherwise grow the local target directory by tens of
# gigabytes across check, clippy, test, and dev builds.
[profile.dev]
debug = 1
incremental = false

[profile.dev.package."*"]
debug = 0

[profile.test]
debug = 1
incremental = false

[profile.test.package."*"]
debug = 0
