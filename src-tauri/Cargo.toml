[package]
name = "terminal"
version = "0.1.0"
description = "A Tauri App"
authors = ["you"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "terminal_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.5.6", features = [] }

[dependencies]
tauri = { version = "2.10.3", features = ["macos-private-api"] }
tauri-plugin-shell = "2.3.5"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
ssh-rs = "0.5.0"
russh = "0.57.1"
russh-keys = "0.49.2"
russh-sftp = "2.1.1"
ssh-key = "0.6"
tokio = { version = "1.50.0", features = ["full"] }
tauri-plugin-sql = { version = "2.3.2", features = ["sqlite"] }
tauri-plugin-window-state = "2.4.1"
anyhow = "1.0"
futures = "0.3"
portable-pty = "0.8"
uuid = { version = "1.0", features = ["v4"] }
# Encryption
aes-gcm = "0.10"
argon2 = "0.5"
rand = "0.8"
base64 = "0.22"
dirs = "5"
once_cell = "1.19"
parking_lot = "0.12"
# Serial port support
serialport = "4.6"
rustix = { version = "0.38", features = ["std", "termios"] }
libc = "0.2"
tauri-plugin-global-shortcut = "2.3.1"
