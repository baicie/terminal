[package]
name = "terminal"
version = "0.0.1-dev.2"
description = "Modern SSH/SFTP terminal client with team collaboration"
authors = ["baicie"]
license = "MIT"
edition = "2021"
rust-version = "1.96"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "terminal_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
# `codegen` moves asset embedding into the build script so Cargo can track
# `dist/`. Without it, `generate_context!` embeds the frontend at macro
# expansion and Cargo never invalidates the crate when `dist/` changes — a
# frontend-only change then ships the previous UI. See build.rs.
tauri-build = { version = "2", features = ["codegen"] }

[features]
# Test-only Vault acceptance probe; the command is a no-op without it.
smoke-vault-probe = []
# Test-only IPC surface: the terminal smoke harness, the physical-keyboard input probe,
# the raw-input probe, the remote shell-prompt probe and the shell probe.
#
# Off by default, and **absent** rather than disabled when off: `generate_handler!`
# re-emits `#[cfg]` on each arm, so a feature-off build has no handler for these names.
# Before this feature existed they were registered unconditionally, and
# `TerminalSmokeState::from_env()` read `TERMINAL_SMOKE` in every build — so a production
# binary started with that variable entered smoke mode and wrote to a caller-supplied
# path with the app's own privileges. Measured by the DDQ14 audit.
smoke-probe = []
# Test-only updater runtime: check, download, verify and install from a loopback
# endpoint. Absent from every production build.
smoke-updater = []
# The AI model transport (UX-4). Empty on purpose.
#
# `docs/design/terminal-next/07-ux4-ai-inspector.md` §4 puts the OpenAI-compatible
# request behind a Rust feature: the API key must not enter the renderer, and a build
# without the feature must have no model network path at all — not a disabled one, an
# absent one.
#
# The feature gates the *commands and the transport*, not `reqwest`: `reqwest` is
# already a non-optional dependency of `storage.rs` (WebDAV/S3/REST), so making it
# optional here would buy nothing and would couple this feature to storage. What a
# feature-off build loses is `ai_generate`, `ai_cancel`, `ai_profiles_list`,
# `ai_available` and the whole `src/ai/` module — proven by
# `scripts/check-ai-isolation.mjs`, which builds without it and asserts the symbols
# and the `/chat/completions` string are gone.
#
# Not a default feature: `cargo build` alone produces a binary with no AI transport.
# `tauri.conf.json`'s `build.features` turns it on for the product build, the same
# shape `custom-protocol` uses.
ai = []
# Embeds the frontend from `frontendDist` into the binary via Tauri's custom
# protocol. Without it `tauri/build.rs` sets `dev = !custom_protocol`, and a bare
# `cargo build --release` produces an executable that loads an empty shell from a
# dev server that is not running — a grey window with no JS ever executing.
#
# `tauri build` adds this feature automatically, which is why the packaged app
# always worked and only hand-rolled `cargo build --release` was broken. Declaring
# it here makes the two paths agree. Empty by default: `tauri build` still turns
# it on, and every other `cargo` invocation stays a dev-server build unless asked.
custom-protocol = ["tauri/custom-protocol"]
# Native GUI E2E: embeds a loopback WebDriver HTTP server so WebdriverIO can drive
# the real WKWebView/WebKitGTK/WebView2. NOT a default feature and never enabled by
# a release build. See docs/testing/native-gui-e2e.md and the threat model.
#
# It requires `custom-protocol`: a GUI harness driving an empty shell with no
# JavaScript is testing nothing. That dependency is stated here rather than left
# to the caller so `--features gui-e2e` alone produces a runnable app.
#
# This feature exists so the driver can be *proven absent* from a production
# binary rather than merely documented as absent: `scripts/check-gui-e2e-isolation.mjs`
# builds without it and asserts the symbols and the config are gone.
# `tauri/test` gives `tauri::test::mock_runtime`, which runs the real
# `invoke_handler` — the IPC-boundary tests use it. It is part of `gui-e2e` rather than a
# separate feature so the suite that already builds a test-only binary is the one that
# carries the mock runtime, and no production build acquires it.
gui-e2e = ["dep:tauri-plugin-wdio-webdriver", "custom-protocol", "tauri/test"]

[dependencies]
tauri = { version = "2.10", features = ["macos-private-api", "tray-icon", "image-png"] }
# Optional on purpose: absent from the dependency graph unless `gui-e2e` is on.
tauri-plugin-wdio-webdriver = { version = "1.5", optional = true }
tauri-plugin-shell = "2"
tauri-plugin-notification = "2"
tauri-plugin-updater = "2"
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
russh = "0.65"
russh-sftp = "2.1"
ssh-key = { version = "0.7.0-rc.11", features = ["ed25519", "rsa", "p256", "p384", "p521", "encryption", "rand_core", "getrandom"] }
# `test-util` is additive and only affects test builds: it is what makes
# `tokio::time::pause()` available, which one RC07 case needs to exercise a 20-second
# budget without making a neighbouring test time out. `full` does not include it.
tokio = { version = "1.52", features = ["full", "test-util"] }
tauri-plugin-sql = { version = "2", features = ["sqlite"] }
# P8.2: the import command names the plugin's own Pool<Sqlite>, so this version
# has to stay unified with the one Cargo.lock pins (0.8.6); a second sqlx major
# or minor would make the pool type unnameable.
sqlx = { version = "0.8", default-features = false, features = ["sqlite", "runtime-tokio"] }
tauri-plugin-window-state = "2"
anyhow = "1.0"
futures = "0.3"
bytes = "1"
chrono = "0.4"
reqwest = { version = "0.13", features = ["json"] }
hmac = "0.12"
time = { version = "0.3", features = ["formatting", "parsing"] }
async-trait = "0.1"
portable-pty = "0.9"
uuid = { version = "1", features = ["v4"] }
# Encryption
sha2 = "0.10"
hex = "0.4"
aes-gcm = "0.10"
argon2 = "0.5"
rand = "0.8"
base64 = "0.22"
dirs = "6"
once_cell = "1.21"
parking_lot = "0.12"
# Atomic vault persistence: same-directory temp file + rename (cross-platform)
tempfile = "3"
zeroize = "1"
# Serial port support
serialport = "4.9"
rustix = { version = "1.1", features = ["std", "termios"] }
libc = "0.2"
tauri-plugin-global-shortcut = "2"
log = "0.4"
cfg-if = "1"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json", "fmt"] }
tracing-log = "0.2"
tauri-plugin-single-instance = "2"

# Tauri's dependency graph is large. Full dependency debuginfo plus Cargo's
# incremental caches can otherwise grow the local target directory by tens of
# gigabytes across check, clippy, test, and dev builds.
[profile.dev]
debug = 1
incremental = false

[profile.dev.package."*"]
debug = 0

[profile.test]
debug = 1
incremental = false

[profile.test.package."*"]
debug = 0

# Release size, opt-in only.
#
# The default `release` profile is deliberately left untouched so `cargo build
# --release`, the CI compile gate and every local debug cycle keep their current
# cost. Size-optimised artifacts are produced with `--profile release-small`.
#
# Why this exists: the stock binary is 34.4 MB, of which __LINKEDIT alone is
# 7.1 MB of symbol and string tables nothing consumes -- there is no dSYM
# archive step and no backtrace symbolication anywhere in this crate.
#
# `panic` stays at the inherited default `unwind`. db_import::writer uses
# AssertUnwindSafe(..).catch_unwind() to keep a panicking import on the same
# ROLLBACK path as any other failure; `panic = "abort"` would kill the process
# with the transaction still open and the pooled connection unrecoverable.
#
# `opt-level` stays at 3 for the same reason: this binary drives PTY and SFTP
# data paths, and "s"/"z" costs throughput that no test here would catch.
[profile.release-small]
inherits = "release"
lto = "fat"
codegen-units = 1
strip = "symbols"

# Release Engineering acceptance matrix (this round only).
#
# `release-small` above bundles strip + LTO, so it cannot say which of the two
# produced the size change. These three isolate one axis each against the
# untouched `release` profile, which is the fourth arm of the comparison. All
# four must be built from the same commit and the same `dist/`.
#
# Symbol files are archived alongside each arm (see
# `scripts/release-engineering/build-matrix.mjs`): `strip` alone is only
# acceptable for a shipped build if the dSYM/PDB/debug file is kept, because
# there is no other way to symbolicate a crash.
[profile.release-strip]
inherits = "release"
strip = "symbols"

[profile.release-lto]
inherits = "release"
lto = "fat"
codegen-units = 1

[profile.release-strip-lto]
inherits = "release"
lto = "fat"
codegen-units = 1
strip = "symbols"

[target.'cfg(unix)'.dependencies]
# F17 — the soak measures this process's own RSS and open file descriptors.
#
# `libc` is already in the tree (0.2.186, arriving via tokio et al.); naming it directly
# costs nothing new and avoids pulling a process-metrics crate for two syscalls. Windows
# needs a different API and a different permission model, so `session::process_metrics`
# reports `None` there rather than pretending to measure.
libc = "0.2"
